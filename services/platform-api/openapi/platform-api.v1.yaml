openapi: 3.1.0
info:
  title: Money Noodle Platform API
  summary: Interface-neutral Money Noodle platform contract.
  description: Canonical v1 transport contract for public and operational platform reads.
  version: 1.0.0
  license:
    name: MIT
    identifier: MIT
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: /
    description: Runtime-configured API origin.
security: []
tags:
  - name: Platform
    description: Safe public platform observations.
  - name: Paper
    description: >-
      Read-only views of the simulated ("paper") trading record, served from the
      read-only projection an existing separate system writes. Simulation only:
      no operation here reaches a funded balance, and none of these figures is a
      real-money position.
  - name: Market
    description: >-
      Read-only public market data from third-party venues and price sources,
      served through this API's own feed adapters. Observation only: no operation
      here places an order, holds a venue credential, or reaches a simulated or
      funded balance.
  - name: Identity
    description: >-
      Sign-in and the server-side session it establishes. The session is this
      platform's own revocable grant, not a provider credential: no token and no
      provider claim is stored beside it or returned by any operation here.
  - name: Budgets
    description: >-
      The account's two budget records and their controls, which are identical for
      both. A control is recorded as durable intent and performs nothing; the job
      that owns the capability reads it at the start of its next run. The `live`
      budget has no execution path at all in this milestone.
  - name: Operations
    description: Minimal deployment health probes.
paths:
  /v1/platform/status:
    get:
      operationId: getPlatformStatus
      summary: Read the current public platform availability observation.
      tags: [Platform]
      responses:
        '200':
          description: Current authoritative platform availability observation.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformStatus'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/paper/budget:
    get:
      operationId: getPaperBudget
      summary: Read the simulated bankroll and its most recent executions.
      description: >-
        The singleton simulated budget row and the executions recorded beside it,
        newest first. Amounts are US cents, as the source records them; the client
        decides how to display them.


        The record is never inferred. When the read model has published no budget
        row, or cannot be reached, or returns a record this API does not
        understand, the response is a problem document with 503 and a distinct
        code — never a zero balance and never an empty record.
      tags: [Paper]
      responses:
        '200':
          description: The published simulated budget record.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaperBudget'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/ReadModelProblem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/paper/performance/summary:
    get:
      operationId: getPaperPerformanceSummary
      summary: Read the bounded forecast and simulated-trade summary.
      description: >-
        The small summary record a front page can poll: forecast accuracy
        counters, calibration progress, the simulated trade record, and the four
        most recent forecasts.


        `generatedAt` is the source system's own clock when it last wrote this
        summary, never this API's clock. No staleness threshold is applied: a
        summary of any age is served as published, and the times needed to judge
        its freshness are in the response.
      tags: [Paper]
      responses:
        '200':
          description: The published summary record.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaperPerformanceSummary'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/ReadModelProblem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/paper/performance:
    get:
      operationId: getPaperPerformance
      summary: Read the full forecast and simulated-trade record.
      description: >-
        The complete analytical record: the full forecast summary with its
        segments, benchmarks, calibration bins and timeline, the simulated trade
        record, per-provider records, per-funding epochs, the bounded forecast
        history, and the optional cycle-path diagnostics.


        Intended for on-demand reads rather than polling: the document is large.
        Every field is rebuilt from the stored record rather than passed through,
        so a field withdrawn from this contract cannot reappear from an older
        stored document, and an unknown field in the stored record is dropped
        rather than served.
      tags: [Paper]
      responses:
        '200':
          description: The published full record.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaperPerformance'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/ReadModelProblem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/market/overview:
    get:
      operationId: getMarketOverview
      summary: Read the current public market overview.
      description: >-
        Public market data for the assets both fifteen-minute prediction venues
        list: the spot snapshot with its seven-day series, each venue's current
        quote for the cycle now trading, the distance from the cycle's settlement
        reference, a weekly price history, and the headline list.


        Market data only. There is no forecast, no entry signal, no fill estimate
        and no ranking by any model or policy: the assets are published in registry
        order, and every derived number here is arithmetic over values published
        beside it in the same response.


        Freshness is explicit. Each feed in `feeds` carries `fresh`, `stale` or
        `unavailable`, the time this API obtained its value, and a fixed reason code
        when it is not fresh. `stale` means a refresh failed and the previous value
        is still inside its five-minute limit; past that the feed is `unavailable`
        and the members it would have filled are absent — never zero, and never
        inferred. `fetchedAt` is always this API's own clock: these providers
        publish no source time, so none is invented. A total upstream outage is
        still a 200 whose every feed says `unavailable`.


        Where this response uses the exchange's one-minute series — the cycle's
        settlement reference, the current price derived from it, and the realized
        volatility in `basis` — only finished minutes are used. The minute still
        forming is dropped, so a published close always describes a minute that
        completed.


        No caller-facing refresh control exists. Each feed has its own server-side
        lifetime and concurrent callers share one refresh, so asking more often
        cannot make this API ask a provider more often.
      tags: [Market]
      responses:
        '200':
          description: The current market overview, with a state for every feed.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketOverview'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/market/hourly-thresholds:
    get:
      operationId: getHourlyThresholdMarkets
      summary: Read the hourly above/below threshold contracts and their model probabilities.
      description: >-
        One venue's "settles above a strike" and "settles below a strike" contracts
        for the hour now trading, for every registry asset, each with the
        probability a zero-drift log-normal diffusion gives it from recent realized
        volatility.


        Research and observation only. The probability beside a quote is arithmetic
        over public data whose inputs — the current price, the volatility estimate
        and the sample count — are published with it; it is not advice, not a
        position and not an entry decision. The difference from the asking price is
        published because it is the obvious subtraction.


        The current price and the volatility sample come from finished one-minute
        candles only: the minute still forming is dropped before either is computed,
        so the price is the last completed minute's close and the newest return in
        the sample describes a whole minute.


        Per-asset degradation is normal and is expressed inside a 200. An asset
        whose listing could not be read, or that has no exact one-hour group
        trading, carries its reasons in `unavailableReasons` and omits the numbers
        it cannot support. A listing that offered one usable side publishes that
        side and names the other. `marketDataAvailable` is true only for a complete,
        unambiguous pair.
      tags: [Market]
      responses:
        '200':
          description: The hourly threshold contracts, with a state for every asset.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HourlyThresholdMarkets'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/identity/session:
    post:
      operationId: signIn
      summary: Exchange a verified identity-provider token for a server-side session.
      description: >-
        The only sign-in path. The body carries an identity token issued by the
        configured identity provider; this API verifies it, requires that it
        proves a second factor was used for this sign-in, and establishes a
        server-side session bound to the single account.


        The response carries no token and no credential. The session is an opaque
        identifier returned in an `HttpOnly`, `Secure`, `SameSite=Strict` cookie,
        and every later request is authorised against a row this platform owns, so
        revocation is immediate and does not depend on the provider.


        A refusal is a problem document and says only which of the fixed reasons
        it was. The difference between a bad signature, a wrong audience and an
        expired token is deliberately not published.
      tags: [Identity]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '201':
          description: A session was established.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionSummary'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/IdentityProblem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    get:
      operationId: getSession
      summary: Read the current session.
      description: >-
        Confirms that the caller holds an accepted session and names the account
        it is bound to. Carries no identity-provider claim and no personal data:
        the account identifier and the session's expiry are the whole of it.
      tags: [Identity]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The current session.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionSummary'
        '401':
          $ref: '#/components/responses/IdentityProblem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: signOut
      summary: Revoke the current session.
      description: >-
        Sets the session's revocation time server-side and clears the cookie.
        Presenting a session that is already unknown, revoked or expired still
        succeeds, so this operation cannot be used to discover which session
        identifiers exist; presenting none at all is refused.
      tags: [Identity]
      security:
        - sessionCookie: []
      responses:
        '204':
          description: The session is revoked.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
        '401':
          $ref: '#/components/responses/IdentityProblem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/budgets:
    get:
      operationId: listBudgets
      summary: List the account's budget records.
      description: >-
        Exactly two records, `paper` and `live`, with the same schema. The
        difference between them is authority, not structure: `live` carries
        `hasExecutionAuthority: false` and nothing in this platform can act on it.
      tags: [Budgets]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The account's budget records.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetList'
        '401':
          $ref: '#/components/responses/IdentityProblem'
        '503':
          $ref: '#/components/responses/ReadModelProblem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/budgets/{kind}:
    parameters:
      - $ref: '#/components/parameters/BudgetKind'
    get:
      operationId: getBudgetDetail
      summary: Read one budget record and the control state derived from its intent.
      description: >-
        `desiredState` is what the latest `pause` or `resume` intent asked for.
        `appliedState` is what a job said it did, and is `null` until a job has
        read that intent. The two are separate fields rather than one because an
        operator's request and an engine's action are different facts, and in this
        milestone no job exists to turn the first into the second.
      tags: [Budgets]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The budget record and its derived control state.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetDetail'
        '401':
          $ref: '#/components/responses/IdentityProblem'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/ReadModelProblem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/budgets/{kind}/controls:
    parameters:
      - $ref: '#/components/parameters/BudgetKind'
    post:
      operationId: recordBudgetControl
      summary: Record a control action against a budget as durable intent.
      description: >-
        Identical for both budgets. The action is appended to the append-only
        control table as an intent row carrying the capability, action, actor,
        epoch, recorded time and run identifier, and **this API performs no
        effect**: the job that owns the capability reads intent at the start of
        its next run.


        A 202 therefore means the request is recorded and auditable, never that
        anything has happened. For the `live` budget no job exists at all, so the
        row is recorded and audited and nothing will act on it.
      tags: [Budgets]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlRequest'
      responses:
        '202':
          description: The intent is recorded. Nothing has been performed.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlAccepted'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/IdentityProblem'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/budgets/{kind}/intents:
    parameters:
      - $ref: '#/components/parameters/BudgetKind'
    get:
      operationId: getBudgetIntentHistory
      summary: Read the recorded control intent and what jobs said about it.
      description: >-
        The audit, newest first, ordered by `(epoch, recordedAt, id)` — the same
        ordering the staleness rule uses, so the first entry is the one a job
        would treat as current. Each entry carries the outcome rows a job appended
        against it, which is empty until a job has run.
      tags: [Budgets]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The bounded intent history for this budget's capability.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentHistory'
        '401':
          $ref: '#/components/responses/IdentityProblem'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/ReadModelProblem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/engine/jobs:
    get:
      operationId: getJobHealth
      summary: Read the last recorded run of each engine job.
      description: >-
        One entry per capability the engine store knows about. A job that has
        never run reports null times and no outcome, which in this milestone is
        every job: the engine boundary is accepted and no job is built.
      tags: [Budgets]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The last recorded run of each job.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobHealthReport'
        '401':
          $ref: '#/components/responses/IdentityProblem'
        '503':
          $ref: '#/components/responses/ReadModelProblem'
        default:
          $ref: '#/components/responses/Problem'
  /health/live:
    get:
      operationId: getLiveness
      summary: Confirm that the API process can answer HTTP requests.
      tags: [Operations]
      responses:
        '200':
          description: Process is live.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /health/ready:
    get:
      operationId: getReadiness
      summary: Confirm that the API is ready to serve its declared contract.
      tags: [Operations]
      responses:
        '200':
          description: Deployment is ready.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-mn_session
      description: >-
        An opaque server-side session identifier. It carries no claim and no
        signature: everything a request needs is in the session row this platform
        owns, so revocation is immediate and does not involve the identity
        provider. The cookie is `HttpOnly`, `Secure`, `SameSite=Strict` and
        `Path=/`, and its `__Host-` prefix makes a browser refuse it unless those
        hold.
  parameters:
    BudgetKind:
      name: kind
      in: path
      required: true
      description: Which of the account's two budget records the operation addresses.
      schema:
        $ref: '#/components/schemas/BudgetKind'
  headers:
    RequestId:
      description: Bounded diagnostic correlation identifier.
      schema:
        $ref: '#/components/schemas/RequestId'
  responses:
    IdentityProblem:
      description: >-
        The request carried no accepted session, or the session was refused. The
        `errorCode` distinguishes the reasons this API is willing to publish:
        `MN-SESSION-REQUIRED` (no session was presented), `MN-SESSION-REJECTED`
        (the session is unknown, revoked or expired), `MN-IDENTITY-REJECTED` (the
        presented identity token was not accepted),
        `MN-SECOND-FACTOR-REQUIRED` (the token did not prove a second factor was
        used) and `MN-IDENTITY-NOT-CONFIGURED` (this revision has no identity
        configuration). No provider message is ever carried.
      headers:
        x-request-id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ReadModelProblem:
      description: >-
        The read model could not answer. The `errorCode` distinguishes the three
        reasons: `MN-READ-MODEL-UNREACHABLE` (the read model could not be
        reached), `MN-READ-MODEL-NOT-PUBLISHED` (it is reachable and has
        published no such record yet), and `MN-READ-MODEL-INVALID` (it returned a
        record this API does not understand; `detail` names the field path that
        failed and no value from it).
      headers:
        x-request-id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem:
      description: Safe RFC 9457 problem details response.
      headers:
        x-request-id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    PlatformStatus:
      type: object
      additionalProperties: false
      required: [state, asOf, service, schemaVersion, requestId]
      properties:
        state:
          type: string
          enum: [available, degraded, maintenance]
        asOf:
          type: string
          format: date-time
        service:
          $ref: '#/components/schemas/ServiceDescriptor'
        schemaVersion:
          type: string
          const: '1'
        requestId:
          $ref: '#/components/schemas/RequestId'
    ServiceDescriptor:
      type: object
      additionalProperties: false
      required: [name, version]
      properties:
        name:
          type: string
          const: platform-api
        version:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z0-9][A-Za-z0-9._+-]*$'
    Health:
      type: object
      additionalProperties: false
      required: [status, service, version]
      properties:
        status:
          type: string
          enum: [live, ready]
        service:
          type: string
          const: platform-api
        version:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z0-9][A-Za-z0-9._+-]*$'
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, errorCode, requestId]
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
          minLength: 1
          maxLength: 120
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          minLength: 1
          maxLength: 500
        instance:
          type: string
          format: uri-reference
        errorCode:
          type: string
          pattern: '^MN-[A-Z0-9-]{3,48}$'
        requestId:
          $ref: '#/components/schemas/RequestId'
    RequestId:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9._:-]+$'
    # --- Shared read-model vocabulary ---------------------------------------
    #
    # Two rules decide how a string field is typed below, and they are worth
    # stating once rather than per field.
    #
    #   * A value the source database constrains (`venue`, `side`, `outcome`,
    #     `liquidityRole`) is a closed enum: a value outside the set is refused
    #     before it reaches a response.
    #   * A value the source database does not constrain, or that arrives inside
    #     a stored JSON document, is an open string whose known values are listed
    #     in its description. An unknown stored value must not break a client, so
    #     it is served as the string it is.
    SourceTime:
      description: >-
        A time recorded by the system that produced the data, normalized to
        ISO-8601 UTC. Never this API's own clock.
      type: string
      format: date-time
    Cents:
      description: >-
        An amount in US cents, as the source records it. May be negative. May be
        fractional where the source keeps sub-cent precision; a value the source
        holds to more precision than this representation can carry exactly is
        refused rather than rounded.
      type: number
    Ratio:
      description: >-
        A fraction, not a percentage: 0.42 is 42%. A probability-point difference
        is expressed the same way, so 0.05 is 5 points.
      type: number
    NullableRatio:
      description: >-
        A fraction as in `Ratio`, or `null` when its denominator is zero and the
        source therefore reports no value. `null` is a real answer and is never
        substituted with zero.
      type: [number, 'null']
    NullableNumber:
      description: >-
        A finite number, or `null` where the source reports no value. `null` is
        never substituted with zero.
      type: [number, 'null']
    Count:
      description: A non-negative count.
      type: integer
      minimum: 0
    OpaqueLabel:
      description: >-
        A display label chosen by the source system. Opaque to this API: it may
        contain non-ASCII punctuation and its set of values is not fixed.
      type: string
      minLength: 1
      maxLength: 200

    # --- 1. Simulated budget ------------------------------------------------
    PaperBudget:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - requestId
        - durable
        - sourceUpdatedAt
        - startingCents
        - availableCents
        - equityCents
        - reservedCents
        - proposedStakeCents
        - running
        - depleted
        - openOrders
        - settledOrders
        - realizedPnlCents
        - bankrollResets
        - recentExecutions
      properties:
        schemaVersion:
          type: string
          const: '1'
        requestId:
          $ref: '#/components/schemas/RequestId'
        durable:
          description: >-
            Always true. The record was read from the durable read model, which is
            the only source this operation has; it is published so a client can
            tell this record apart from a locally assembled one without inspecting
            its fields.
          type: boolean
          const: true
        sourceUpdatedAt:
          description: >-
            When the source system last replaced this budget record. Disclosed so
            freshness can be judged by the reader; this API applies no staleness
            threshold and never withholds a record for being old.
          $ref: '#/components/schemas/SourceTime'
        startingCents:
          description: The simulated bankroll's starting balance.
          $ref: '#/components/schemas/Cents'
        availableCents:
          description: Uncommitted simulated cash.
          $ref: '#/components/schemas/Cents'
        equityCents:
          description: '`availableCents` plus `reservedCents`.'
          $ref: '#/components/schemas/Cents'
        reservedCents:
          description: Intended stake across the open positions.
          $ref: '#/components/schemas/Cents'
        proposedStakeCents:
          description: >-
            The next stake the simulation would commit: the smaller of available
            cash and the configured per-position cap, and zero when there is no
            available cash.
          $ref: '#/components/schemas/Cents'
        running:
          description: Whether available cash is above zero.
          type: boolean
        depleted:
          description: Whether available cash is at or below zero with nothing still open.
          type: boolean
        openOrders:
          $ref: '#/components/schemas/Count'
        settledOrders:
          $ref: '#/components/schemas/Count'
        realizedPnlCents:
          description: >-
            Realized profit and loss for the **current** bankroll funding only,
            on the source's whole-cent accounting, including its recorded
            fee corrections, and reset when the bankroll is reset.


            This is deliberately a different number from `realizedPnlCents` on the
            full record, which is exact and lifetime. The two are not expected to
            agree, and neither is wrong: they answer different questions. A client
            that wants the reconciliation residual computes
            `equityCents - (startingCents + realizedPnlCents)` itself.
          $ref: '#/components/schemas/Cents'
        bankrollResets:
          $ref: '#/components/schemas/Count'
        recentExecutions:
          description: >-
            The most recent executions, newest `createdAt` first, at most 30. The
            source replaces this list whole with every budget write, so it is the
            whole recent history rather than a page of a longer one. An empty list
            beside a present budget record is a valid answer.
          type: array
          maxItems: 30
          items:
            $ref: '#/components/schemas/PaperExecution'
    PaperExecution:
      description: >-
        One recorded simulated execution. The four conditional fields are
        **absent** rather than null when the source has no value for them, which
        is how the source distinguishes "not yet known" from "known to be
        nothing".
      type: object
      additionalProperties: false
      required:
        - executionKey
        - symbol
        - venue
        - side
        - status
        - createdAt
        - closesAt
        - askPrice
        - quantity
        - stakeCents
        - feeCents
      properties:
        executionKey:
          description: >-
            The source's own identity for this execution, stable across reads.
            Published so a client can key a list without inventing an index.
          type: string
          minLength: 1
          maxLength: 200
        symbol:
          description: The asset symbol the position is on.
          type: string
          minLength: 1
          maxLength: 64
        venue:
          type: string
          enum: [polymarket, kalshi]
        side:
          description: The direction the position was taken in.
          type: string
          enum: [UP, DOWN]
        status:
          description: >-
            Lifecycle state, as the source records it. Known values are
            `pending_reservation`, `uncertain`, `open`, `sold`, `won`, `lost`,
            `invalid`, `unfilled` and `rejected`; "settled" means `won`, `lost`,
            `invalid` or `sold`. The source does not constrain this column, so an
            unrecognised value is served as the string it is rather than refused.
          type: string
          minLength: 1
          maxLength: 64
        createdAt:
          description: When the position was taken, on the source's clock.
          $ref: '#/components/schemas/SourceTime'
        closesAt:
          description: When the contract settles, as the venue stated it.
          $ref: '#/components/schemas/SourceTime'
        askPrice:
          description: >-
            Price paid, as a fraction of one dollar in 0..1: 0.42 is 42 cents per
            contract.
          $ref: '#/components/schemas/Ratio'
        quantity:
          description: Contracts held. May be fractional.
          type: number
        stakeCents:
          description: Amount committed. May be fractional where the source keeps sub-cent precision.
          $ref: '#/components/schemas/Cents'
        feeCents:
          description: Fee charged. May be fractional.
          $ref: '#/components/schemas/Cents'
        pnlCents:
          description: Realized profit and loss. Absent while the position is unsettled.
          $ref: '#/components/schemas/Cents'
        outcome:
          description: How the contract resolved. Absent while unresolved.
          type: string
          enum: [UP, DOWN]
        noFillReason:
          description: >-
            Why an attempt did not fill, as the source classified it. Known values
            are `post_only_race`, `rested_no_fill`, `pre_submit_quote_moved` and
            `ioc_no_fill`. Absent on a filled position. The source does not
            constrain this column, so an unrecognised value is served as the
            string it is.
          type: string
          minLength: 1
          maxLength: 64
        liquidityRole:
          description: Whether the order rested on the book or crossed it. Absent when unrecorded.
          type: string
          enum: [maker, taker]

    # --- 2. Bounded summary -------------------------------------------------
    PaperPerformanceSummary:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - requestId
        - durable
        - generatedAt
        - sourceUpdatedAt
        - summary
        - paperRecord
      properties:
        schemaVersion:
          type: string
          const: '1'
        requestId:
          $ref: '#/components/schemas/RequestId'
        durable:
          description: Always true, as on the budget record.
          type: boolean
          const: true
        generatedAt:
          description: >-
            When the source system last computed this summary, on its own clock.
            Older stored records carry no such stamp; for those this falls back to
            the row's own last-written time, normalized to ISO-8601 UTC.
          $ref: '#/components/schemas/SourceTime'
        sourceUpdatedAt:
          description: >-
            When the stored record was last written. Published alongside
            `generatedAt` because the two differ: the row is rewritten more often
            than the full document inside it is recomputed.
          $ref: '#/components/schemas/SourceTime'
        summary:
          $ref: '#/components/schemas/ForecastSignalSummary'
        paperRecord:
          $ref: '#/components/schemas/PaperTrackSummary'
    ForecastSignalSummary:
      description: >-
        Forecast counters. Every counter except the calibration pair is over
        qualifying forecasts only — those the source did not mark as excluded.
      type: object
      additionalProperties: false
      required:
        - issued
        - cycles
        - resolved
        - resolvedCycles
        - accuracy
        - cycleBalancedAccuracy
        - brierScore
        - currentCycleStreak
        - calibrationWindows
        - calibrationMinimum
        - calibrationProgress
        - calibrationReady
        - recent
      properties:
        issued:
          $ref: '#/components/schemas/Count'
        cycles:
          description: Distinct asset-cycles among the issued forecasts.
          $ref: '#/components/schemas/Count'
        resolved:
          $ref: '#/components/schemas/Count'
        resolvedCycles:
          $ref: '#/components/schemas/Count'
        accuracy:
          description: Correct over resolved. Null when nothing is resolved.
          $ref: '#/components/schemas/NullableRatio'
        cycleBalancedAccuracy:
          description: Mean of the per-cycle accuracies, so a busy cycle does not dominate.
          $ref: '#/components/schemas/NullableRatio'
        brierScore:
          description: Mean Brier score over resolved forecasts. Lower is better.
          $ref: '#/components/schemas/NullableNumber'
        currentCycleStreak:
          description: >-
            Signed run length over consecutive cycles: positive for correct,
            negative for wrong, zero when nothing is resolved.
          type: integer
        calibrationWindows:
          description: >-
            Distinct resolved settlement times. Counted over **all** forecasts,
            not only qualifying ones, which is why it can exceed `resolvedCycles`.
          $ref: '#/components/schemas/Count'
        calibrationMinimum:
          description: >-
            How many windows the source's own policy requires before it treats
            calibration as readable. Data, not a constant of this API.
          $ref: '#/components/schemas/Count'
        calibrationProgress:
          description: Windows over the minimum, capped at 1.
          $ref: '#/components/schemas/Ratio'
        calibrationReady:
          type: boolean
        recent:
          description: The most recent forecasts, at most four.
          type: array
          maxItems: 4
          items:
            $ref: '#/components/schemas/ForecastHistoryEntry'
    PaperTrackSummary:
      description: The bounded simulated trade record.
      type: object
      additionalProperties: false
      required:
        - mode
        - settled
        - windows
        - wins
        - losses
        - winRate
        - roi
        - realizedPnlCents
        - meanPredictedEdge
        - meanRealizedReturn
      properties:
        mode:
          description: Always `paper`. A record in any other mode is refused rather than served.
          type: string
          const: paper
        settled:
          description: Settled positions, which includes those resolved as void and those exited early.
          $ref: '#/components/schemas/Count'
        windows:
          description: Distinct settlement times among settled positions.
          $ref: '#/components/schemas/Count'
        wins:
          $ref: '#/components/schemas/Count'
        losses:
          $ref: '#/components/schemas/Count'
        winRate:
          description: >-
            Wins over **settled**, and settled includes void and early-exited
            positions. `wins + losses` therefore need not equal `settled`, and
            this is deliberately not `wins / (wins + losses)`. Kept as the source
            computes it so this record and the source agree.
          $ref: '#/components/schemas/NullableRatio'
        roi:
          description: Returned minus staked, over staked. Null when nothing was staked.
          $ref: '#/components/schemas/NullableRatio'
        realizedPnlCents:
          description: >-
            Lifetime realized profit and loss on the source's exact accounting.
            Not the same number as the budget record's, which is whole-cent and
            scoped to the current funding.
          $ref: '#/components/schemas/Cents'
        meanPredictedEdge:
          description: Simple mean of the per-position predicted edge, in probability points.
          $ref: '#/components/schemas/NullableRatio'
        meanRealizedReturn:
          description: >-
            Return per unit staked, averaged within each settlement window first
            and then across windows, so correlated positions closing together
            count once.
          $ref: '#/components/schemas/NullableNumber'
    ForecastHistoryEntry:
      description: One forecast, as published. Resolution fields are absent while it is pending.
      type: object
      additionalProperties: false
      required:
        - id
        - symbol
        - direction
        - directionalLikelihood
        - issuedAt
        - modelVersion
        - policyVersion
        - confidence
        - status
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 200
        symbol:
          type: string
          minLength: 1
          maxLength: 64
        direction:
          description: The forecast direction. Known values are `UP` and `DOWN`.
          type: string
          minLength: 1
          maxLength: 32
        directionalLikelihood:
          description: The model's probability for the stated direction.
          $ref: '#/components/schemas/Ratio'
        issuedAt:
          $ref: '#/components/schemas/SourceTime'
        modelVersion:
          type: string
          minLength: 1
          maxLength: 120
        policyVersion:
          type: string
          minLength: 1
          maxLength: 120
        confidence:
          $ref: '#/components/schemas/Ratio'
        status:
          description: Known values are `pending`, `resolved` and `invalid`.
          type: string
          minLength: 1
          maxLength: 32
        outcome:
          description: How it resolved. Absent while pending. Known values are `UP` and `DOWN`.
          type: string
          minLength: 1
          maxLength: 32
        correct:
          description: Absent while pending.
          type: boolean

    # --- 3. Full record -----------------------------------------------------
    PaperPerformance:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - requestId
        - durable
        - generatedAt
        - sourceUpdatedAt
        - summary
        - paperRecord
        - paperProviderRecords
        - paperEpochs
        - forecasts
      properties:
        schemaVersion:
          type: string
          const: '1'
        requestId:
          $ref: '#/components/schemas/RequestId'
        durable:
          description: Always true, as on the budget record.
          type: boolean
          const: true
        generatedAt:
          description: >-
            When the source system last replaced this full document, on its own
            clock. This is **not** the row's last-written time: the row is
            rewritten much more often than the full document is recomputed, so
            `sourceUpdatedAt` would overstate this document's freshness. Older
            stored records carry no such stamp; for those this falls back to
            `sourceUpdatedAt`.
          $ref: '#/components/schemas/SourceTime'
        sourceUpdatedAt:
          description: When the stored row was last written, for the reason given above.
          $ref: '#/components/schemas/SourceTime'
        summary:
          $ref: '#/components/schemas/ForecastRecordSummary'
        paperRecord:
          $ref: '#/components/schemas/PaperTrackRecord'
        paperProviderRecords:
          description: >-
            One record per venue and market with any simulated position, ordered
            by settled count descending. Empty when the source stored none.
          type: array
          items:
            $ref: '#/components/schemas/ProviderTrackRecord'
        paperEpochs:
          description: >-
            One entry per bankroll funding, oldest first. A new funding starts at
            each bankroll reset.
          type: array
          items:
            $ref: '#/components/schemas/BankrollEpoch'
        forecasts:
          description: >-
            The forecast history the source publishes, newest first and bounded by
            the source at 500 entries.
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/ForecastHistoryEntry'
        cyclePaths:
          description: >-
            Observation-only path diagnostics. Absent when the source stored none;
            absence is not an error.
          $ref: '#/components/schemas/CyclePathReport'
    ForecastRecordSummary:
      description: >-
        The full forecast summary. Counters are over qualifying forecasts unless a
        field says otherwise; every array is published only for the groups the
        source found data for, so an empty array means "nothing qualified", not
        "not computed".
      type: object
      additionalProperties: false
      required:
        - issued
        - pending
        - resolved
        - cycles
        - resolvedCycles
        - cycleBalancedAccuracy
        - correct
        - invalid
        - accuracy
        - brierScore
        - logLoss
        - currentStreak
        - currentCycleStreak
        - observedCalculations
        - resolvedCalculations
        - benchmarks
        - edgeBuckets
        - segments
        - missedBuyCounterfactual
        - resolvedWindows
        - evaluationMinimumWindows
        - evaluationMeaningful
        - realizedEdgeTrades
        - meanPredictedEdge
        - meanRealizedReturn
        - byLeadTime
        - calibrationBins
        - calibrationWindows
        - calibrationMinimum
        - calibrationProgress
        - calibrationReady
        - byAsset
        - byDirection
        - byModelVersion
        - byConfidenceBucket
        - timeline
        - recent
      properties:
        issued:
          $ref: '#/components/schemas/Count'
        pending:
          $ref: '#/components/schemas/Count'
        resolved:
          $ref: '#/components/schemas/Count'
        cycles:
          $ref: '#/components/schemas/Count'
        resolvedCycles:
          $ref: '#/components/schemas/Count'
        cycleBalancedAccuracy:
          $ref: '#/components/schemas/NullableRatio'
        correct:
          $ref: '#/components/schemas/Count'
        invalid:
          $ref: '#/components/schemas/Count'
        accuracy:
          $ref: '#/components/schemas/NullableRatio'
        brierScore:
          $ref: '#/components/schemas/NullableNumber'
        logLoss:
          description: Mean natural-log loss over resolved forecasts.
          $ref: '#/components/schemas/NullableNumber'
        currentStreak:
          description: Signed run length over consecutive resolved forecasts.
          type: integer
        currentCycleStreak:
          description: Signed run length over consecutive cycles.
          type: integer
        observedCalculations:
          $ref: '#/components/schemas/Count'
        resolvedCalculations:
          $ref: '#/components/schemas/Count'
        benchmarks:
          description: Rival probability sources, published only where one had resolved forecasts.
          type: array
          items:
            $ref: '#/components/schemas/BenchmarkScore'
        edgeBuckets:
          type: array
          items:
            $ref: '#/components/schemas/EdgeBucket'
        segments:
          type: array
          items:
            $ref: '#/components/schemas/SegmentGroup'
        missedBuyCounterfactual:
          $ref: '#/components/schemas/MissedBuyCounterfactual'
        resolvedWindows:
          description: Distinct settlement times among resolved forecasts.
          $ref: '#/components/schemas/Count'
        evaluationMinimumWindows:
          description: Windows the source requires before it treats the evaluation as meaningful.
          $ref: '#/components/schemas/Count'
        evaluationMeaningful:
          type: boolean
        realizedEdgeTrades:
          description: Resolved entries carrying both a predicted edge and a realized return.
          $ref: '#/components/schemas/Count'
        meanPredictedEdge:
          $ref: '#/components/schemas/NullableRatio'
        meanRealizedReturn:
          $ref: '#/components/schemas/NullableNumber'
        byLeadTime:
          description: Sliced by time from issuance to settlement.
          type: array
          items:
            $ref: '#/components/schemas/LeadTimeSlice'
        calibrationBins:
          type: array
          items:
            $ref: '#/components/schemas/CalibrationBin'
        calibrationWindows:
          $ref: '#/components/schemas/Count'
        calibrationMinimum:
          $ref: '#/components/schemas/Count'
        calibrationProgress:
          $ref: '#/components/schemas/Ratio'
        calibrationReady:
          type: boolean
        byAsset:
          type: array
          items:
            $ref: '#/components/schemas/ForecastSlice'
        byDirection:
          type: array
          items:
            $ref: '#/components/schemas/ForecastSlice'
        byModelVersion:
          type: array
          items:
            $ref: '#/components/schemas/ForecastSlice'
        byConfidenceBucket:
          type: array
          items:
            $ref: '#/components/schemas/ForecastSlice'
        timeline:
          description: Chronological accuracy curve, downsampled by the source to at most 500 points.
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/ForecastTimelinePoint'
        recent:
          description: The most recent forecasts, at most eight.
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/ForecastHistoryEntry'
    ForecastSlice:
      description: One group of resolved forecasts.
      type: object
      additionalProperties: false
      required: [label, resolved, correct, accuracy]
      properties:
        label:
          $ref: '#/components/schemas/OpaqueLabel'
        resolved:
          $ref: '#/components/schemas/Count'
        correct:
          $ref: '#/components/schemas/Count'
        accuracy:
          $ref: '#/components/schemas/Ratio'
    LeadTimeSlice:
      description: >-
        A forecast slice by time from issuance to settlement. Labels are the
        source's bands and are opaque.
      type: object
      additionalProperties: false
      required: [label, resolved, correct, accuracy, brierScore]
      properties:
        label:
          $ref: '#/components/schemas/OpaqueLabel'
        resolved:
          $ref: '#/components/schemas/Count'
        correct:
          $ref: '#/components/schemas/Count'
        accuracy:
          $ref: '#/components/schemas/Ratio'
        brierScore:
          $ref: '#/components/schemas/NullableNumber'
    CalibrationBin:
      description: Forecast probability against observed outcome rate, in one probability band.
      type: object
      additionalProperties: false
      required: [label, resolved, meanForecast, observedRate]
      properties:
        label:
          $ref: '#/components/schemas/OpaqueLabel'
        resolved:
          $ref: '#/components/schemas/Count'
        meanForecast:
          $ref: '#/components/schemas/Ratio'
        observedRate:
          $ref: '#/components/schemas/Ratio'
    BenchmarkScore:
      description: One rival probability source, scored on the same resolved forecasts.
      type: object
      additionalProperties: false
      required: [label, resolved, accuracy, brierScore, logLoss]
      properties:
        label:
          $ref: '#/components/schemas/OpaqueLabel'
        resolved:
          $ref: '#/components/schemas/Count'
        accuracy:
          $ref: '#/components/schemas/NullableRatio'
        brierScore:
          $ref: '#/components/schemas/NullableNumber'
        logLoss:
          $ref: '#/components/schemas/NullableNumber'
    EdgeBucket:
      description: Positions grouped by the edge predicted at entry.
      type: object
      additionalProperties: false
      required: [label, trades, predictedEdge, realizedReturn, winRate]
      properties:
        label:
          $ref: '#/components/schemas/OpaqueLabel'
        trades:
          $ref: '#/components/schemas/Count'
        predictedEdge:
          $ref: '#/components/schemas/Ratio'
        realizedReturn:
          description: Return per unit staked, averaged across the bucket.
          type: number
        winRate:
          description: Share of the bucket whose outcome matched the entry side.
          $ref: '#/components/schemas/Ratio'
    SegmentGroup:
      description: >-
        One dimension the source sliced positions by, with its segments ordered by
        mean realized return descending. Dimension names are the source's and are
        opaque.
      type: object
      additionalProperties: false
      required: [dimension, description, segments]
      properties:
        dimension:
          $ref: '#/components/schemas/OpaqueLabel'
        description:
          type: string
          minLength: 1
          maxLength: 500
        segments:
          type: array
          items:
            $ref: '#/components/schemas/SegmentStat'
    SegmentStat:
      description: One segment of a dimension.
      type: object
      additionalProperties: false
      required:
        - label
        - trades
        - windows
        - meanPredictedEdge
        - meanRealizedReturn
        - standardError
        - winRate
      properties:
        label:
          $ref: '#/components/schemas/OpaqueLabel'
        trades:
          $ref: '#/components/schemas/Count'
        windows:
          $ref: '#/components/schemas/Count'
        meanPredictedEdge:
          $ref: '#/components/schemas/Ratio'
        meanRealizedReturn:
          description: >-
            Return per unit staked, clustered by settlement window. **Nullable by
            necessity:** the source can compute this as not-a-number, which JSON
            carries as null, and a record carrying it is a real record rather than
            a broken one.
          $ref: '#/components/schemas/NullableNumber'
        standardError:
          description: Sample standard error across windows. Null with fewer than two windows.
          $ref: '#/components/schemas/NullableNumber'
        winRate:
          $ref: '#/components/schemas/Ratio'
    MissedBuyCounterfactual:
      description: >-
        Observation only: sides a policy floor rejected, so none of these was ever
        traded, simulated or otherwise.
      type: object
      additionalProperties: false
      required:
        - label
        - description
        - candidates
        - windows
        - profitableCandidates
        - meanCandidateReturn
        - standardError
        - bestPerWindowCandidates
        - bestPerWindowWins
        - bestPerWindowMeanReturn
        - bestPerWindowStandardError
        - bestPerWindowTotalReturn
      properties:
        label:
          $ref: '#/components/schemas/OpaqueLabel'
        description:
          type: string
          minLength: 1
          maxLength: 500
        candidates:
          $ref: '#/components/schemas/Count'
        windows:
          $ref: '#/components/schemas/Count'
        profitableCandidates:
          $ref: '#/components/schemas/Count'
        meanCandidateReturn:
          $ref: '#/components/schemas/NullableNumber'
        standardError:
          $ref: '#/components/schemas/NullableNumber'
        bestPerWindowCandidates:
          $ref: '#/components/schemas/Count'
        bestPerWindowWins:
          $ref: '#/components/schemas/Count'
        bestPerWindowMeanReturn:
          $ref: '#/components/schemas/NullableNumber'
        bestPerWindowStandardError:
          $ref: '#/components/schemas/NullableNumber'
        bestPerWindowTotalReturn:
          $ref: '#/components/schemas/NullableNumber'
    ForecastTimelinePoint:
      description: One point on the accuracy curve.
      type: object
      additionalProperties: false
      required: [time, resolved, cumulativeAccuracy, rollingAccuracy, cumulativeBrier]
      properties:
        time:
          $ref: '#/components/schemas/SourceTime'
        resolved:
          description: Running count of resolved forecasts at this point, counting from one.
          type: integer
          minimum: 1
        cumulativeAccuracy:
          $ref: '#/components/schemas/Ratio'
        rollingAccuracy:
          description: Accuracy over the trailing 25 resolved forecasts.
          $ref: '#/components/schemas/Ratio'
        cumulativeBrier:
          type: number
    PaperTrackRecord:
      description: >-
        The full simulated trade record. Every counterfactual field here is an
        observation about a decision that was not taken; none of them describes a
        position that existed.
      type: object
      additionalProperties: false
      required:
        - mode
        - settled
        - pending
        - windows
        - wins
        - losses
        - invalid
        - sold
        - unfilled
        - rejected
        - stakedCents
        - returnedCents
        - realizedPnlCents
        - roi
        - winRate
        - meanPredictedEdge
        - meanRealizedReturn
        - standardError
        - switchesEvaluated
        - meanSwitchVsHoldCents
        - standaloneExitsEvaluated
        - actionCounterfactualVersion
        - actionCounterfactuals
        - principalRecoveryExitsEvaluated
        - principalRecoveryVsFullExitCents
        - meanPrincipalRecoveryVsFullExitCents
        - segments
      properties:
        mode:
          type: string
          const: paper
        settled:
          $ref: '#/components/schemas/Count'
        pending:
          $ref: '#/components/schemas/Count'
        windows:
          $ref: '#/components/schemas/Count'
        wins:
          $ref: '#/components/schemas/Count'
        losses:
          $ref: '#/components/schemas/Count'
        invalid:
          $ref: '#/components/schemas/Count'
        sold:
          description: Positions exited before settlement.
          $ref: '#/components/schemas/Count'
        unfilled:
          $ref: '#/components/schemas/Count'
        rejected:
          $ref: '#/components/schemas/Count'
        stakedCents:
          description: Exact amount staked across settled positions.
          $ref: '#/components/schemas/Cents'
        returnedCents:
          description: Exact amount returned by settled positions.
          $ref: '#/components/schemas/Cents'
        realizedPnlCents:
          description: '`returnedCents` minus `stakedCents`.'
          $ref: '#/components/schemas/Cents'
        roi:
          $ref: '#/components/schemas/NullableRatio'
        winRate:
          description: Wins over settled, with the same denominator caveat as the bounded summary.
          $ref: '#/components/schemas/NullableRatio'
        meanPredictedEdge:
          $ref: '#/components/schemas/NullableRatio'
        meanRealizedReturn:
          $ref: '#/components/schemas/NullableNumber'
        standardError:
          $ref: '#/components/schemas/NullableNumber'
        switchesEvaluated:
          $ref: '#/components/schemas/Count'
        meanSwitchVsHoldCents:
          description: Mean cents per evaluated switch against holding instead. Observation only.
          $ref: '#/components/schemas/NullableNumber'
        standaloneExitsEvaluated:
          $ref: '#/components/schemas/Count'
        actionCounterfactualVersion:
          description: The source's version for the counterfactual method below.
          type: string
          minLength: 1
          maxLength: 120
        actionCounterfactuals:
          type: array
          items:
            $ref: '#/components/schemas/ActionCounterfactualArm'
        principalRecoveryExitsEvaluated:
          $ref: '#/components/schemas/Count'
        principalRecoveryVsFullExitCents:
          $ref: '#/components/schemas/NullableNumber'
        meanPrincipalRecoveryVsFullExitCents:
          $ref: '#/components/schemas/NullableNumber'
        segments:
          description: >-
            Empty when nothing has settled; otherwise the source's dimensions in
            its own order.
          type: array
          items:
            $ref: '#/components/schemas/SegmentGroup'
    ActionCounterfactualArm:
      description: >-
        One alternative action, scored against the action actually taken on the
        same positions.
      type: object
      additionalProperties: false
      required:
        - action
        - alternative
        - policy
        - basis
        - description
        - decisions
        - windows
        - decisionsBeatingAlternative
        - hitRate
        - takenPnlCents
        - alternativePnlCents
        - incrementalCents
        - meanIncrementalCents
        - meanIncrementalReturn
        - incrementalReturnStandardError
        - credible
      properties:
        action:
          description: The action taken. Known values are `HOLD`, `EXIT` and `SWITCH`.
          type: string
          minLength: 1
          maxLength: 32
        alternative:
          $ref: '#/components/schemas/OpaqueLabel'
        policy:
          $ref: '#/components/schemas/OpaqueLabel'
        basis:
          description: >-
            How the alternative's outcome was established. Known values are
            `authoritative` (the settled outcome) and `approximate` (an estimate
            from a recorded quote).
          type: string
          minLength: 1
          maxLength: 32
        description:
          type: string
          minLength: 1
          maxLength: 500
        decisions:
          $ref: '#/components/schemas/Count'
        windows:
          $ref: '#/components/schemas/Count'
        decisionsBeatingAlternative:
          $ref: '#/components/schemas/Count'
        hitRate:
          $ref: '#/components/schemas/NullableRatio'
        takenPnlCents:
          $ref: '#/components/schemas/Cents'
        alternativePnlCents:
          $ref: '#/components/schemas/Cents'
        incrementalCents:
          description: '`takenPnlCents` minus `alternativePnlCents`.'
          $ref: '#/components/schemas/Cents'
        meanIncrementalCents:
          $ref: '#/components/schemas/NullableNumber'
        meanIncrementalReturn:
          $ref: '#/components/schemas/NullableNumber'
        incrementalReturnStandardError:
          $ref: '#/components/schemas/NullableNumber'
        credible:
          description: >-
            Whether the source saw enough independent settlement windows to treat
            the mean as readable. False is not evidence of no effect.
          type: boolean
    ProviderTrackRecord:
      description: The same simulated trade record, scoped to one venue and market.
      type: object
      additionalProperties: false
      required: [providerId, marketId, record]
      properties:
        providerId:
          description: >-
            The venue. Known values are `polymarket`, `kalshi`, `crypto-com`,
            `forecastex` and `robinhood`; stored values outside that set are
            served as they are.
          type: string
          minLength: 1
          maxLength: 64
        marketId:
          description: >-
            The market family. Known values are `crypto-15m`, `crypto-1h` and
            `crypto-spot`.
          type: string
          minLength: 1
          maxLength: 64
        record:
          $ref: '#/components/schemas/PaperTrackRecord'
    BankrollEpoch:
      description: One bankroll funding, from its first position to its last.
      type: object
      additionalProperties: false
      required: [epochId, trades, settled, realizedPnlCents, budgetPnlCents, stakedCents, current]
      properties:
        epochId:
          description: The source's opaque identity for this funding.
          type: string
          minLength: 1
          maxLength: 200
        trades:
          $ref: '#/components/schemas/Count'
        settled:
          $ref: '#/components/schemas/Count'
        realizedPnlCents:
          description: Exact accounting, as on the full record.
          $ref: '#/components/schemas/Cents'
        budgetPnlCents:
          description: >-
            Whole-cent accounting, as on the budget record; for the current
            funding it includes the bankroll's recorded corrections.
          $ref: '#/components/schemas/Cents'
        stakedCents:
          $ref: '#/components/schemas/Cents'
        firstAt:
          description: Earliest position in this funding. Absent when it has none.
          $ref: '#/components/schemas/SourceTime'
        lastAt:
          description: Latest position in this funding. Absent when it has none.
          $ref: '#/components/schemas/SourceTime'
        current:
          description: True for exactly the funding now backing the simulated bankroll.
          type: boolean
    CyclePathReport:
      description: Observation-only diagnostics about how prices moved within each cycle.
      type: object
      additionalProperties: false
      required: [policyVersion, totalCycles, completedCycles, totalPoints, latestByAsset]
      properties:
        policyVersion:
          type: string
          minLength: 1
          maxLength: 120
        totalCycles:
          $ref: '#/components/schemas/Count'
        completedCycles:
          description: Cycles whose settlement time had passed when the source built this report.
          $ref: '#/components/schemas/Count'
        totalPoints:
          $ref: '#/components/schemas/Count'
        latestByAsset:
          type: array
          items:
            $ref: '#/components/schemas/CyclePathLatest'
    CyclePathLatest:
      type: object
      additionalProperties: false
      required: [symbol, closesAt, features]
      properties:
        symbol:
          type: string
          minLength: 1
          maxLength: 64
        closesAt:
          $ref: '#/components/schemas/SourceTime'
        features:
          $ref: '#/components/schemas/CycleRegimeFeatures'
    CycleRegimeFeatures:
      description: >-
        Path diagnostics for one cycle. Percentage-unit fields are **percent**,
        not ratios: 0.12 means 0.12%. The two optional fields are absent on
        records the source wrote before they existed.
      type: object
      additionalProperties: false
      required:
        - observedAt
        - observationCount
        - coverageSeconds
        - signFlipRate
        - lagOneAutocorrelation
        - trendEfficiency
        - rangePercent
        - localVolatilityPerSecond
        - localVolatility15mPercent
        - regime
      properties:
        observedAt:
          $ref: '#/components/schemas/SourceTime'
        observationCount:
          $ref: '#/components/schemas/Count'
        coverageSeconds:
          description: Seconds between the first and last observation.
          type: number
          minimum: 0
        signFlipRate:
          $ref: '#/components/schemas/NullableRatio'
        lagOneAutocorrelation:
          description: Lag-one autocorrelation of returns, in -1..1.
          $ref: '#/components/schemas/NullableNumber'
        trendEfficiency:
          $ref: '#/components/schemas/NullableRatio'
        signedTrendEfficiency:
          description: Trend efficiency with direction, in -1..1. Absent on older records.
          $ref: '#/components/schemas/NullableNumber'
        netChangePercent:
          description: Net change in percent units. Absent on older records.
          $ref: '#/components/schemas/NullableNumber'
        rangePercent:
          description: Observed range in percent units.
          $ref: '#/components/schemas/NullableNumber'
        localVolatilityPerSecond:
          $ref: '#/components/schemas/NullableNumber'
        localVolatility15mPercent:
          description: Fifteen-minute volatility in percent units.
          $ref: '#/components/schemas/NullableNumber'
        regime:
          description: >-
            How the source classified the path. Known values are `insufficient`,
            `trending`, `mean-reverting` and `mixed`.
          type: string
          minLength: 1
          maxLength: 64
    # --- Public market data -------------------------------------------------
    #
    # Two rules decide the shape of everything below, and both are the opposite of
    # what the earlier generation of this product did.
    #
    #   * An absent upstream value is an absent member. Nothing here defaults to
    #     zero, to one half, or to a fabricated placeholder quote, so a published
    #     number is always a number a provider actually reported.
    #   * Every feed states its own freshness. A caller can tell a current value
    #     from a five-minute-old one without inspecting it.
    ApiTime:
      description: >-
        A time on this API's own clock, ISO-8601 UTC. Used where no provider
        publishes a time of its own: these market sources state when a contract
        closes, never when the value they just returned was measured, so the only
        honest time this API can give for a feed value is when it obtained it.
      type: string
      format: date-time
    VenueTime:
      description: A time a venue or publisher stated, normalized to ISO-8601 UTC.
      type: string
      format: date-time
    MarketFeedReason:
      description: >-
        Why a feed is not fresh, in a fixed vocabulary. `upstream-unavailable` is a
        provider that refused or could not be reached, `upstream-rate-limited` one
        that declined for rate reasons, `upstream-timeout` one that did not answer
        within this API's per-call deadline, and `upstream-invalid` a payload whose
        shape this API does not accept. No upstream status line, host, URL or error
        text is ever published.
      type: string
      enum:
        - upstream-invalid
        - upstream-rate-limited
        - upstream-timeout
        - upstream-unavailable
    MarketFeedState:
      description: >-
        How current one feed's value is. `fresh` is a value inside its lifetime;
        `stale` is a successful read of an older value whose refresh failed, still
        inside the five-minute limit; `unavailable` means there is nothing to
        publish and the members this feed fills are absent.
      type: object
      additionalProperties: false
      required: [state, ageSeconds]
      properties:
        state:
          type: string
          enum: [fresh, stale, unavailable]
        ageSeconds:
          description: Seconds since the value was obtained. Zero for a value just fetched.
          type: number
          minimum: 0
        fetchedAt:
          description: >-
            When this API obtained the value. Absent only when there is no value at
            all.
          $ref: '#/components/schemas/ApiTime'
        reason:
          $ref: '#/components/schemas/MarketFeedReason'
    ContractPrice:
      description: >-
        A price on a binary contract, as a fraction of its one-dollar settlement:
        0.62 is sixty-two cents. A bid may be zero; an ask of zero means the side is
        not offered and is omitted rather than published as zero.
      type: number
      minimum: 0
      maximum: 1
    MarketChartPoint:
      type: object
      additionalProperties: false
      required: [time, price]
      properties:
        time:
          description: >-
            The point's time. In a seven-day series this is estimated: the source
            publishes an unlabelled array of prices with no times, so the points are
            spaced evenly backwards from `fetchedAt`. In a weekly history it is the
            exchange's own candle time.
          $ref: '#/components/schemas/ApiTime'
        price:
          description: Price in US dollars, as the source reported it, unrounded.
          type: number
          exclusiveMinimum: 0
    MarketSpot:
      description: >-
        The spot snapshot for one asset. Every member except `chart` is absent when
        the source did not report it; none is defaulted to zero, because a published
        zero change would read as "unchanged".
      type: object
      additionalProperties: false
      required: [chart]
      properties:
        price:
          description: Spot price in US dollars.
          type: number
          exclusiveMinimum: 0
        change1hPercent:
          description: Change over the last hour, in percent units.
          type: number
        change24hPercent:
          description: Change over the last 24 hours, in percent units.
          type: number
        change7dPercent:
          description: Change over the last 7 days, in percent units.
          type: number
        change30dPercent:
          description: Change over the last 30 days, in percent units.
          type: number
        change1yPercent:
          description: Change over the last year, in percent units.
          type: number
        high24h:
          description: Highest price in the last 24 hours, in US dollars.
          type: number
          exclusiveMinimum: 0
        low24h:
          description: Lowest price in the last 24 hours, in US dollars.
          type: number
          exclusiveMinimum: 0
        volume24h:
          description: Reported 24-hour volume in US dollars.
          type: number
          minimum: 0
        iconUrl:
          description: >-
            The source's own icon URL, published only when it is an http or https
            URL.
          type: string
          format: uri
          maxLength: 2048
        chart:
          description: The seven-day series, oldest first. Empty when the source sent none.
          type: array
          maxItems: 400
          items:
            $ref: '#/components/schemas/MarketChartPoint'
    MarketVenueQuote:
      description: >-
        One venue's quote on the up/down contract for the cycle now trading. A side
        the venue is not quoting is absent. No placeholder quote is ever published:
        an asset the venue has not listed for this cycle has no quote here at all.
      type: object
      additionalProperties: false
      required: [venue, contractId, url, closesAt, live]
      properties:
        venue:
          type: string
          enum: [kalshi, polymarket]
        contractId:
          description: The venue's own identifier for the contract.
          type: string
          minLength: 1
          maxLength: 128
        ticker:
          description: The venue's ticker, where it publishes one.
          type: string
          minLength: 1
          maxLength: 128
        url:
          description: The venue's own public page for this market.
          type: string
          format: uri
          maxLength: 2048
        closesAt:
          description: When the venue settles this contract.
          $ref: '#/components/schemas/VenueTime'
        live:
          description: Whether the venue reported the contract as open for orders.
          type: boolean
        probabilityUp:
          description: >-
            The venue's implied probability of settling up, as a fraction. The
            midpoint of the quoted bid and ask where both exist, otherwise the last
            trade. Absent when the venue is quoting neither.
          $ref: '#/components/schemas/Ratio'
        probabilityDown:
          description: The same for the down outcome.
          $ref: '#/components/schemas/Ratio'
        bidUp:
          $ref: '#/components/schemas/ContractPrice'
        askUp:
          $ref: '#/components/schemas/ContractPrice'
        bidDown:
          $ref: '#/components/schemas/ContractPrice'
        askDown:
          $ref: '#/components/schemas/ContractPrice'
        liquidityUsd:
          description: Liquidity in US dollars, as the venue reports it.
          type: number
          minimum: 0
        volumeUsd:
          description: Volume in US dollars, as the venue reports it.
          type: number
          minimum: 0
        volumeContracts:
          description: Volume in contracts, where the venue reports it that way.
          type: number
          minimum: 0
        floorStrike:
          description: The contract's floor strike in US dollars, where the venue states one.
          type: number
          exclusiveMinimum: 0
    MarketContractBasis:
      description: >-
        How far spot has moved from the level the cycle's contract settles against,
        and what the recent minutes imply about that distance. Public arithmetic
        only: every input is published here beside its result.
      type: object
      additionalProperties: false
      required:
        - referencePrice
        - referenceSource
        - currentPrice
        - basisPercent
        - secondsRemaining
        - volatilityPerSecond
        - volatilitySamples
        - standardDeviationPercent
        - zScore
        - probabilityUp
      properties:
        referencePrice:
          description: The settlement reference in US dollars.
          type: number
          exclusiveMinimum: 0
        referenceSource:
          description: >-
            Where the reference came from. `Kraken 1m series at cycle open` is the
            close of the minute that ended as the cycle opened; `Kalshi floor
            strike` is the venue's own stated strike, used when the exchange series
            has no such minute.
          type: string
          minLength: 1
          maxLength: 120
        currentPrice:
          description: >-
            The current price in US dollars: the last completed one-minute close, or
            the exchange's last trade, falling back to the spot snapshot.
          type: number
          exclusiveMinimum: 0
        basisPercent:
          description: Distance from the reference in percent units.
          type: number
        secondsRemaining:
          description: Seconds until the contract settles, fractional.
          type: number
          minimum: 0
        volatilityPerSecond:
          description: >-
            Realized volatility as the standard deviation of log return per root
            second, estimated from completed one-minute closes.
          type: number
          exclusiveMinimum: 0
        volatilitySamples:
          description: One-minute returns the estimate used.
          $ref: '#/components/schemas/Count'
        standardDeviationPercent:
          description: >-
            Expected movement to settlement in percent units, from the estimate
            above over the effective time remaining.
          type: number
        zScore:
          description: The distance from the reference in standard deviations.
          type: number
        probabilityUp:
          description: >-
            The probability of settling above the reference under a zero-drift
            log-normal diffusion, bounded to 0.05..0.95 because the estimate is a
            sample of roughly two hours of minutes and its tails are not worth the
            precision they would suggest.
          $ref: '#/components/schemas/Ratio'
        impliedVolatilityPerSecond:
          description: >-
            The volatility the venues' own probability implies, read back through
            the same model. Absent without a live venue probability.
          type: number
          exclusiveMinimum: 0
        volatilityRatio:
          description: Realized volatility divided by the implied figure above.
          type: number
    MarketAssetOverview:
      type: object
      additionalProperties: false
      required: [symbol, name, longHistory]
      properties:
        symbol:
          type: string
          minLength: 1
          maxLength: 16
        name:
          type: string
          minLength: 1
          maxLength: 64
        spot:
          $ref: '#/components/schemas/MarketSpot'
        polymarket:
          $ref: '#/components/schemas/MarketVenueQuote'
        kalshi:
          description: >-
            Published only when this venue's contract settles within five seconds of
            the other venue's and that settlement is still ahead. Without that, the
            two quotes would answer different questions and inviting the comparison
            would be misleading.
          $ref: '#/components/schemas/MarketVenueQuote'
        basis:
          $ref: '#/components/schemas/MarketContractBasis'
        venueProbabilityUp:
          description: >-
            The venues' combined implied probability of settling up, weighted 0.75
            to Polymarket and 0.25 to Kalshi where both are live and aligned, and
            the single live venue otherwise. Computed from the quotes in this
            response only, so every instance of this API answers the same figure at
            the same instant.
          $ref: '#/components/schemas/Ratio'
        venueDisagreement:
          description: >-
            The absolute difference between the two venues' implied probabilities.
            Needs both, aligned.
          $ref: '#/components/schemas/Ratio'
        longHistory:
          description: Weekly closes, oldest first. Empty when the feed has none for this asset.
          type: array
          maxItems: 1024
          items:
            $ref: '#/components/schemas/MarketChartPoint'
    MarketHeadline:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          description: >-
            Plain text, bounded in length. Markup is removed and a fixed set of
            character entities is decoded once; no sentiment, score or label is
            derived from it.
          type: string
          minLength: 1
          maxLength: 300
        link:
          description: >-
            The publisher's URL, published only when it is an http or https URL.
          type: string
          format: uri
          maxLength: 2048
        publishedAt:
          description: >-
            The publisher's stated time, normalized. Absent when it was missing or
            unparseable.
          $ref: '#/components/schemas/VenueTime'
    MarketOverviewFeeds:
      description: >-
        One state per upstream feed behind this response. A feed assembled from
        several calls reports the worst state and the oldest fetch time of the calls
        behind it, so a partial answer is labelled as one.
      type: object
      additionalProperties: false
      required:
        - spot
        - polymarketQuotes
        - kalshiQuotes
        - referencePrices
        - longHistory
        - news
      properties:
        spot:
          $ref: '#/components/schemas/MarketFeedState'
        polymarketQuotes:
          $ref: '#/components/schemas/MarketFeedState'
        kalshiQuotes:
          $ref: '#/components/schemas/MarketFeedState'
        referencePrices:
          description: The exchange one-minute series the reference and volatility come from.
          $ref: '#/components/schemas/MarketFeedState'
        longHistory:
          $ref: '#/components/schemas/MarketFeedState'
        news:
          $ref: '#/components/schemas/MarketFeedState'
    MarketOverview:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - requestId
        - marketId
        - generatedAt
        - feeds
        - assets
        - headlines
      properties:
        schemaVersion:
          type: string
          const: '1'
        requestId:
          $ref: '#/components/schemas/RequestId'
        marketId:
          type: string
          const: crypto-15m
        generatedAt:
          description: When this API assembled the record, on its own clock.
          $ref: '#/components/schemas/ApiTime'
        feeds:
          $ref: '#/components/schemas/MarketOverviewFeeds'
        assets:
          description: >-
            The assets both fifteen-minute venues list, in registry order. The order
            is fixed and carries no ranking: the earlier generation of this product
            sorted by a policy-derived score, which is model output and not part of
            this capability.
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/MarketAssetOverview'
        headlines:
          description: Headlines in the publisher's own order, at most twelve.
          type: array
          maxItems: 12
          items:
            $ref: '#/components/schemas/MarketHeadline'
    HourlyUnavailableReason:
      description: >-
        Why an asset has no complete threshold pair. The four `upstream-` codes are
        a failed listing read, in the same fixed vocabulary as a feed state;
        `no-active-hour-group` is a venue that answered and lists no exact one-hour
        contract trading now; the four side codes name a side the venue listed zero
        or more than one usable row for.
      type: string
      enum:
        - above-ambiguous
        - above-missing
        - below-ambiguous
        - below-missing
        - no-active-hour-group
        - upstream-invalid
        - upstream-rate-limited
        - upstream-timeout
        - upstream-unavailable
    HourlyThresholdCandidate:
      type: object
      additionalProperties: false
      required:
        - direction
        - displaySide
        - relation
        - label
        - ticker
        - strike
        - marketUrl
        - rulesFingerprint
        - settlementPriceMethod
      properties:
        direction:
          description: >-
            Which side of the strike the contract settles yes on. `ABOVE` and
            `BELOW` have different strikes and are not complements of each other.
          type: string
          enum: [ABOVE, BELOW]
        displaySide:
          description: The direction as an interface would label it.
          type: string
          enum: [UP, DOWN]
        relation:
          type: string
          enum: [greater-than, less-than]
        label:
          description: An unformatted label for the contract, e.g. `Above 64000`.
          type: string
          minLength: 1
          maxLength: 64
        ticker:
          description: The venue's public contract identifier.
          type: string
          minLength: 1
          maxLength: 128
        strike:
          description: The strike in US dollars.
          type: number
          exclusiveMinimum: 0
        marketUrl:
          description: >-
            The venue's public page for the series. The venue publishes no
            per-contract page.
          type: string
          format: uri
          maxLength: 2048
        bidYes:
          $ref: '#/components/schemas/ContractPrice'
        askYes:
          $ref: '#/components/schemas/ContractPrice'
        bidNo:
          $ref: '#/components/schemas/ContractPrice'
        askNo:
          $ref: '#/components/schemas/ContractPrice'
        modelProbabilityYes:
          description: >-
            The probability this contract settles yes under a zero-drift log-normal
            diffusion from the realized volatility of completed minutes.
            Unclamped, so it may be arbitrarily close to zero or one, and it carries
            no fee, no spread and no execution assumption. Absent when no usable
            volatility estimate exists.
          $ref: '#/components/schemas/Ratio'
        modelMinusAsk:
          description: >-
            `modelProbabilityYes` minus `askYes`, as a fraction. Published because
            it is the obvious subtraction of two numbers already here; it is not an
            edge, a recommendation or a position.
          $ref: '#/components/schemas/Ratio'
        modelUnavailableReason:
          description: Present exactly when `modelProbabilityYes` is absent.
          type: string
          enum: [volatility-unavailable]
        rulesFingerprint:
          description: >-
            Hex SHA-256 over the settlement-defining terms of this contract — the
            reference index, the averaging method and window, the rounding and the
            strike — and over nothing that moves. It changes when the terms change,
            so a caller can tell "the same contract, requoted" from "a contract
            whose settlement definition was edited".
          type: string
          pattern: '^[0-9a-f]{64}$'
        settlementPriceMethod:
          description: >-
            How the venue's rules text says the settlement price is determined, as
            parsed from that public prose. `unknown` is an explicit value rather
            than a default that would read as a finding.
          type: string
          enum: [point-in-time, simple-average, time-weighted-average, unknown]
    HourlyThresholdMarket:
      type: object
      additionalProperties: false
      required:
        - symbol
        - name
        - marketDataAvailable
        - listing
        - candidates
        - unavailableReasons
      properties:
        symbol:
          type: string
          minLength: 1
          maxLength: 16
        name:
          type: string
          minLength: 1
          maxLength: 64
        marketDataAvailable:
          description: >-
            True only for a complete, unambiguous pair: exactly one contract above a
            strike and exactly one below one.
          type: boolean
        listing:
          description: How current this asset's contract listing is.
          $ref: '#/components/schemas/MarketFeedState'
        spot:
          description: >-
            How current this asset's price series is. Absent when no candidate
            survived, because the series is then not read at all.
          $ref: '#/components/schemas/MarketFeedState'
        openAt:
          description: When the venue opened the hour group.
          $ref: '#/components/schemas/VenueTime'
        closesAt:
          description: When the venue settles the hour group.
          $ref: '#/components/schemas/VenueTime'
        currentPrice:
          description: >-
            The close of the last completed one-minute candle, in US dollars. The
            minute still forming is never used.
          type: number
          exclusiveMinimum: 0
        volatilityPerSecond:
          description: >-
            Realized volatility as the standard deviation of log return per root
            second, from completed one-minute closes. No annualization, no
            weighting, no outlier handling and no safety multiplier.
          type: number
          exclusiveMinimum: 0
        volatilitySamples:
          description: One-minute returns the estimate used.
          $ref: '#/components/schemas/Count'
        candidates:
          description: The usable contracts, above before below. Zero, one or two.
          type: array
          maxItems: 2
          items:
            $ref: '#/components/schemas/HourlyThresholdCandidate'
        unavailableReasons:
          description: Empty exactly when a complete, unambiguous pair was published.
          type: array
          maxItems: 4
          items:
            $ref: '#/components/schemas/HourlyUnavailableReason'
    MarketCapability:
      description: >-
        What this operation's data may be used for, as constants. Market data only:
        nothing here reaches a simulated balance, and this API has no real-money
        authority at all.
      type: object
      additionalProperties: false
      required: [marketData, paper, live]
      properties:
        marketData:
          type: boolean
          const: true
        paper:
          type: boolean
          const: false
        live:
          type: boolean
          const: false
    HourlyThresholdMarkets:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - requestId
        - marketId
        - providerId
        - marketDataVersion
        - modelVersion
        - referenceSource
        - capability
        - generatedAt
        - markets
      properties:
        schemaVersion:
          type: string
          const: '1'
        requestId:
          $ref: '#/components/schemas/RequestId'
        marketId:
          type: string
          const: crypto-1h
        providerId:
          type: string
          const: kalshi
        marketDataVersion:
          description: The read's own version label, for a client that pins behaviour.
          type: string
          const: kalshi-hourly-threshold-read-v1
        modelVersion:
          description: The probability model's version label.
          type: string
          const: strike-threshold-zero-drift-v1
        referenceSource:
          description: The index the venue settles these contracts against.
          type: string
          minLength: 1
          maxLength: 120
        capability:
          $ref: '#/components/schemas/MarketCapability'
        generatedAt:
          description: When this API assembled the record, on its own clock.
          $ref: '#/components/schemas/ApiTime'
        markets:
          description: One entry per registry asset, in registry order, always present.
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/HourlyThresholdMarket'
    BudgetKind:
      description: >-
        Which budget record. The two kinds have identical schemas and identical
        controls; what differs is authority.
      type: string
      enum: [paper, live]
    ControlActionName:
      description: >-
        A control, identical for both budgets. `provider-enable` is recordable
        and, in this milestone, acted on by nothing: there is no provider to
        enable and no funded authority to grant.
      type: string
      enum: [configure, pause, resume, reset, provider-enable]
    IntentOutcomeState:
      description: What a job said it did with an intent row.
      type: string
      enum: [applied, refused, superseded]
    ControlParameters:
      description: >-
        Bounded scalar parameters for a control. An intent row is an audit record
        a person reads, so keys are short identifiers and values are strings,
        numbers or booleans; anything richer needs a schema and a version of its
        own.
      type: object
      maxProperties: 12
      additionalProperties:
        oneOf:
          - type: string
            minLength: 1
            maxLength: 120
          - type: number
          - type: boolean
      propertyNames:
        pattern: '^[a-z][a-z0-9_]{0,38}$'
    SignInRequest:
      type: object
      additionalProperties: false
      required: [idToken]
      properties:
        idToken:
          description: >-
            An identity token issued by the configured provider. It is verified
            and discarded; nothing derived from it is stored beside the session.
          type: string
          minLength: 1
          maxLength: 8192
    SessionSummary:
      type: object
      additionalProperties: false
      required: [accountId, expiresAt, schemaVersion, requestId]
      properties:
        accountId:
          description: The single account this session is bound to.
          $ref: '#/components/schemas/OpaqueLabel'
        expiresAt:
          description: When this session stops being accepted, on this API's clock.
          $ref: '#/components/schemas/ApiTime'
        schemaVersion:
          type: string
          const: '1'
        requestId:
          $ref: '#/components/schemas/RequestId'
    BudgetSummary:
      type: object
      additionalProperties: false
      required: [id, kind, createdAt, hasExecutionAuthority]
      properties:
        id:
          $ref: '#/components/schemas/OpaqueLabel'
        kind:
          $ref: '#/components/schemas/BudgetKind'
        createdAt:
          $ref: '#/components/schemas/ApiTime'
        hasExecutionAuthority:
          description: >-
            Whether anything in this platform can act on this budget. False for
            `live` in this milestone and for as long as no funded-authority design
            is accepted: the record exists, the controls record intent, and no
            venue credential, wire module, reconciliation job or arming path
            exists.
          type: boolean
    BudgetList:
      type: object
      additionalProperties: false
      required: [budgets, schemaVersion, requestId]
      properties:
        budgets:
          description: Exactly two records, `paper` and `live`, in a stable order.
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: '#/components/schemas/BudgetSummary'
        schemaVersion:
          type: string
          const: '1'
        requestId:
          $ref: '#/components/schemas/RequestId'
    BudgetDetail:
      type: object
      additionalProperties: false
      required:
        [
          budget,
          capability,
          desiredState,
          appliedState,
          epoch,
          latestIntentAt,
          schemaVersion,
          requestId,
        ]
      properties:
        budget:
          $ref: '#/components/schemas/BudgetSummary'
        capability:
          description: The capability intent for this budget is recorded against.
          $ref: '#/components/schemas/OpaqueLabel'
        desiredState:
          description: >-
            What the latest `pause` or `resume` intent asked for. `unset` means no
            such control has ever been recorded.
          type: string
          enum: [running, paused, unset]
        appliedState:
          description: >-
            What a job last said it did. Null until a job has read an intent row,
            which in this milestone is always.
          oneOf:
            - $ref: '#/components/schemas/IntentOutcomeState'
            - type: 'null'
        epoch:
          description: The control epoch of the latest intent row, or 0 when there is none.
          type: integer
          minimum: 0
        latestIntentAt:
          description: When the latest intent was recorded, or null when there is none.
          oneOf:
            - $ref: '#/components/schemas/ApiTime'
            - type: 'null'
        schemaVersion:
          type: string
          const: '1'
        requestId:
          $ref: '#/components/schemas/RequestId'
    ControlRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action:
          $ref: '#/components/schemas/ControlActionName'
        parameters:
          oneOf:
            - $ref: '#/components/schemas/ControlParameters'
            - type: 'null'
    ControlAccepted:
      type: object
      additionalProperties: false
      required: [intentId, capability, action, recorded, schemaVersion, requestId]
      properties:
        intentId:
          description: The identity of the appended intent row.
          $ref: '#/components/schemas/OpaqueLabel'
        capability:
          $ref: '#/components/schemas/OpaqueLabel'
        action:
          $ref: '#/components/schemas/ControlActionName'
        recorded:
          description: >-
            Always true, and always only this. The row is recorded; nothing has
            been performed, and a job will read it at the start of its next run.
          type: boolean
          const: true
        schemaVersion:
          type: string
          const: '1'
        requestId:
          $ref: '#/components/schemas/RequestId'
    RecordedIntent:
      type: object
      additionalProperties: false
      required: [id, capability, action, actor, epoch, recordedAt, runId, parameters]
      properties:
        id:
          $ref: '#/components/schemas/OpaqueLabel'
        capability:
          $ref: '#/components/schemas/OpaqueLabel'
        action:
          $ref: '#/components/schemas/ControlActionName'
        actor:
          description: >-
            The principal, agent or workload identity that recorded the row. This
            platform has one account, so this is that account's identifier and
            never an identity-provider subject.
          $ref: '#/components/schemas/OpaqueLabel'
        epoch:
          type: integer
          minimum: 1
        recordedAt:
          $ref: '#/components/schemas/SourceTime'
        runId:
          $ref: '#/components/schemas/OpaqueLabel'
        parameters:
          oneOf:
            - $ref: '#/components/schemas/ControlParameters'
            - type: 'null'
    RecordedOutcome:
      type: object
      additionalProperties: false
      required: [id, intentId, appliedRunId, appliedAt, outcome, reason]
      properties:
        id:
          $ref: '#/components/schemas/OpaqueLabel'
        intentId:
          $ref: '#/components/schemas/OpaqueLabel'
        appliedRunId:
          $ref: '#/components/schemas/OpaqueLabel'
        appliedAt:
          $ref: '#/components/schemas/SourceTime'
        outcome:
          $ref: '#/components/schemas/IntentOutcomeState'
        reason:
          description: A fixed code from the job's own vocabulary. Never provider text.
          $ref: '#/components/schemas/OpaqueLabel'
    IntentHistoryEntry:
      type: object
      additionalProperties: false
      required: [intent, outcomes]
      properties:
        intent:
          $ref: '#/components/schemas/RecordedIntent'
        outcomes:
          description: What jobs appended against this intent. Empty until one has run.
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/RecordedOutcome'
    IntentHistory:
      type: object
      additionalProperties: false
      required: [capability, entries, schemaVersion, requestId]
      properties:
        capability:
          $ref: '#/components/schemas/OpaqueLabel'
        entries:
          description: Newest first, ordered by `(epoch, recordedAt, id)`.
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/IntentHistoryEntry'
        schemaVersion:
          type: string
          const: '1'
        requestId:
          $ref: '#/components/schemas/RequestId'
    JobHealthEntry:
      type: object
      additionalProperties: false
      required: [capability, lastRunId, lastRunAt, lastOutcome]
      properties:
        capability:
          $ref: '#/components/schemas/OpaqueLabel'
        lastRunId:
          oneOf:
            - $ref: '#/components/schemas/OpaqueLabel'
            - type: 'null'
        lastRunAt:
          oneOf:
            - $ref: '#/components/schemas/SourceTime'
            - type: 'null'
        lastOutcome:
          oneOf:
            - $ref: '#/components/schemas/IntentOutcomeState'
            - type: 'null'
    JobHealthReport:
      type: object
      additionalProperties: false
      required: [jobs, schemaVersion, requestId]
      properties:
        jobs:
          description: One entry per capability the engine store knows about.
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/JobHealthEntry'
        schemaVersion:
          type: string
          const: '1'
        requestId:
          $ref: '#/components/schemas/RequestId'
