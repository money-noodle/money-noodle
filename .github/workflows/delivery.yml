              key=lambda rule: len(rule[0]),
              reverse=True,
          )

          Path(os.environ['RUNNER_TEMP'], 'account-redactions.json').write_text(json.dumps(rules))
          for value, _ in rules:
              print(f'::add-mask::{value}')
          PY

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - id: rollback-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          audience: money-noodle-delivery
          token_format: access_token

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.GCP_REGISTRY_HOST }}
          username: oauth2accesstoken
          password: ${{ steps.rollback-auth.outputs.access_token }}

      - name: Load and verify the configured artifact from state
        working-directory: infra/stacks/${{ github.event.inputs.stack }}
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_BUCKET_PREFIX: ${{ vars.GCP_STATE_BUCKET_PREFIX }}
          IMAGE: ${{ vars.GCP_REGISTRY_HOST }}/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_REGISTRY_REPOSITORY }}/${{ github.event.inputs.stack == 'web' && 'web' || 'platform-api' }}
        run: |
          set -euo pipefail
          tofu init -input=false \
            -backend-config="bucket=${STATE_BUCKET_PREFIX}-${{ github.event.inputs.stack }}" \
            -backend-config="prefix=stacks/${{ github.event.inputs.stack }}"
          digest="$(tofu output -raw deployed_digest)"
          version="$(tofu output -raw artifact_version)"
          source_commit="$(tofu output -raw source_commit)"
          revision_suffix="$(tofu output -raw configured_revision_suffix 2>/dev/null || true)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$source_commit" =~ ^[0-9a-f]{40}$ ]]
          [[ -n "$version" ]]
          gh attestation verify "oci://${IMAGE}@${digest}" \
            --repo "${{ github.repository }}" \
            --signer-workflow "${{ github.repository }}/.github/workflows/delivery.yml" \
            --source-digest "$source_commit" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners \
            --predicate-type https://slsa.dev/provenance/v1
          {
            echo "TF_VAR_image_digest=$digest"
            echo "TF_VAR_artifact_version=$version"
            echo "TF_VAR_source_commit=$source_commit"
            [[ -z "$revision_suffix" ]] || echo "TF_VAR_revision_suffix=$revision_suffix"
          } >> "$GITHUB_ENV"

      - name: Reassign traffic to the prior revision without changing the template
        working-directory: infra/stacks/${{ github.event.inputs.stack }}
        env:
          ROLLBACK_REVISION: ${{ github.event.inputs.rollback_revision }}
        run: |
          set -euo pipefail
          [[ "$ROLLBACK_REVISION" =~ ^[a-z]([-a-z0-9]{0,61}[a-z0-9])?$ ]] || {
            echo 'rollback_revision is not a valid Cloud Run revision name.' >&2
            exit 1
          }
          tofu plan -input=false -lock-timeout=5m -out=rollback.tfplan \
            -var="rollback_revision=${ROLLBACK_REVISION}"
          tofu apply -input=false -lock-timeout=5m -auto-approve rollback.tfplan
          rm -f rollback.tfplan

      - id: rollback-service
        name: Read the rolled-back service URI
        working-directory: infra/stacks/${{ github.event.inputs.stack }}
        run: |
          set -euo pipefail
          echo "uri=$(tofu output -raw contract_service_uri)" >> "$GITHUB_OUTPUT"

      # Same audience-bound ID token as the apply probe: the service is private.
      - id: rollback-probe-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          audience: money-noodle-delivery
          create_credentials_file: false
          token_format: id_token
          id_token_audience: ${{ steps.rollback-service.outputs.uri }}

      - name: Verify the rolled-back service is healthy
        env:
          SERVICE_URI: ${{ steps.rollback-service.outputs.uri }}
          PROBE_ID_TOKEN: ${{ steps.rollback-probe-auth.outputs.id_token }}
        run: |
          set -euo pipefail
          code="$(printf 'Authorization: Bearer %s\n' "$PROBE_ID_TOKEN" |
            curl -sS -o /dev/null -w '%{http_code}' --retry 6 --retry-delay 5 \
              --retry-all-errors --max-time 20 -H @- "${SERVICE_URI}/health/ready")"
          [[ "$code" == '200' ]] || { echo "readiness returned ${code}" >&2; exit 1; }
