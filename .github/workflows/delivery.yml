name: Delivery

# Infrastructure checks, artifact publication, and the gated production apply.
#
# SAFETY POSTURE. As committed, this workflow cannot reach Google Cloud at all.
# Every provider-touching job is guarded on repository variables that do not yet
# exist, so with nothing configured the checks run and everything else is
# skipped. Configuring those variables is the maintainer's separately recorded
# provider authorization. Apply and rollback also require a recorded verification
# of real required-reviewer protection; apply additionally needs a typed
# confirmation. See `infra/bootstrap.md`.
#
# `ci.yml` remains the repository's gate for application projects and is
# deliberately untouched by this file.

on:
  pull_request:
    paths:
      - 'infra/**'
      - 'tools/infra-*.mjs'
      - 'tools/delivery/**'
      - 'tools/delivery-control-policy.test.mjs'
      - 'tools/release/**'
      - 'tools/release.test.mjs'
      - 'tools/verify-boundary-rules.mjs'
      - 'eslint.config.mjs'
      - '.github/workflows/delivery.yml'
      - 'apps/web/**'
      - 'services/platform-api/**'
      - 'packages/platform-api-client/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
  push:
    branches: ['main']
    paths:
      - 'infra/**'
      - 'tools/infra-*.mjs'
      - 'tools/delivery/**'
      - 'tools/delivery-control-policy.test.mjs'
      - 'tools/release/**'
      - 'tools/release.test.mjs'
      - 'tools/verify-boundary-rules.mjs'
      - 'eslint.config.mjs'
      - '.github/workflows/delivery.yml'
      - 'apps/web/**'
      - 'services/platform-api/**'
      - 'packages/platform-api-client/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
  schedule:
    # Drift detection. Reads only; never corrects.
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Operation to perform'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - rollback
      stack:
        description: 'Stack to operate on'
        required: true
        default: 'platform'
        type: choice
        options:
          - platform
          - api
          - web
      confirmation:
        description: 'Type APPLY-TO-PRODUCTION to authorise an apply. Ignored for plan.'
        required: false
        type: string
      image_digest:
        description: 'sha256: digest to deploy. Required when applying the web or api stack.'
        required: false
        type: string
      source_commit:
        description: 'Full reviewed source commit that produced image_digest. Required for web or api plan/apply.'
        required: false
        type: string
      rollback_revision:
        description: 'Existing Cloud Run revision to send all traffic to. Rollback only.'
        required: false
        type: string

# Default-deny. Jobs that exchange a provider token raise `id-token` only on
# their own job.
permissions:
  contents: read

# Deployment concurrency is serialised so two applies to one stack cannot
# interleave (ADR-0006). In-progress runs are never cancelled here: cancelling
# mid-apply is how state locks are orphaned.
concurrency:
  group: delivery-${{ github.event.inputs.stack || 'all' }}-${{ github.ref_name }}
  cancel-in-progress: false

env:
  TOFU_VERSION: '1.12.6'

jobs:
  # ---------------------------------------------------------------------------
  # Static checks. No credential, no provider API, no state backend.
  # ---------------------------------------------------------------------------
  checks:
    name: infrastructure checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.24.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          # The wrapper rewrites stdout, which makes plan output harder to read
          # and can leak values into logs.
          tofu_wrapper: false

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Static infrastructure and delivery policy guards
        run: node --test tools/infra-policy.test.mjs tools/infra-delivery-policy.test.mjs

      - name: Provider-disabled delivery control policy guards
        # Grant, journal and witness adapter behaviour. No provider, no
        # credential, no network: see `tools/delivery/README.md`.
        run: node --test tools/delivery-control-policy.test.mjs

      - name: Format, validate, and test every module and stack
        run: node tools/infra-check.mjs all

      - name: Prove evaluated production runtime compatibility
        run: node infra/modules/cloud-run-service/tests/runtime-contract.mjs

      - name: Prove the checks reached no provider
        # `tofu init -backend=false` and mocked-provider tests cannot contact a
        # provider, but a stray credential file would still be evidence of a
        # configuration mistake. This asserts the runner never had one.
        run: |
          if [[ -n "${GOOGLE_APPLICATION_CREDENTIALS:-}" ]]; then
            echo "A credential path was present during static checks." >&2
            exit 1
          fi
          if compgen -G "$HOME/.config/gcloud/*" > /dev/null; then
            echo "Provider credentials were present during static checks." >&2
            exit 1
          fi
          echo "Static checks ran with no provider credential available."

  # ---------------------------------------------------------------------------
  # Guard. Everything below needs bootstrap identifiers that only the maintainer
  # can supply. Until they exist, every downstream job is skipped.
  # ---------------------------------------------------------------------------
  authorization:
    name: authorization state
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      federation_configured: ${{ steps.state.outputs.federation_configured }}
      provider_configured: ${{ steps.state.outputs.provider_configured }}
      apply_authorized: ${{ steps.state.outputs.apply_authorized }}
      environment_reviewers_verified: ${{ steps.state.outputs.environment_reviewers_verified }}
    steps:
      - id: state
        env:
          WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOYER_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
          STATE_BUCKET_PREFIX: ${{ vars.GCP_STATE_BUCKET_PREFIX }}
          REGISTRY_HOST: ${{ vars.GCP_REGISTRY_HOST }}
          REGISTRY_REPOSITORY: ${{ vars.GCP_REGISTRY_REPOSITORY }}
          BILLING_ACCOUNT_ID: ${{ vars.GCP_BILLING_ACCOUNT_ID }}
          BUDGET_ALERT_EMAILS: ${{ vars.GCP_BUDGET_ALERT_EMAIL_ADDRESSES_JSON }}
          APPLY_AUTHORIZED: ${{ vars.INFRA_APPLY_AUTHORIZED }}
          ENVIRONMENT_REVIEWERS_VERIFIED: ${{ vars.PRODUCTION_ENVIRONMENT_REVIEWERS_VERIFIED }}
        run: |
          if [[ -n "$WORKLOAD_IDENTITY_PROVIDER" && -n "$DEPLOYER_SERVICE_ACCOUNT" ]]; then
            echo 'federation_configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'federation_configured=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Federation is not configured. No provider job will run. See infra/bootstrap.md.'
          fi

          required=(PROJECT_ID PROJECT_NUMBER STATE_BUCKET_PREFIX REGISTRY_HOST REGISTRY_REPOSITORY BILLING_ACCOUNT_ID BUDGET_ALERT_EMAILS)
          configured=true
          for name in "${required[@]}"; do
            [[ -n "${!name}" ]] || configured=false
          done
          [[ "$PROJECT_NUMBER" =~ ^[0-9]+$ ]] || configured=false
          [[ "$BILLING_ACCOUNT_ID" =~ ^[0-9A-F]{6}-[0-9A-F]{6}-[0-9A-F]{6}$ ]] || configured=false
          jq -e 'type == "array" and length > 0 and all(.[]; type == "string" and length > 0)' \
            <<< "$BUDGET_ALERT_EMAILS" >/dev/null 2>&1 || configured=false
          echo "provider_configured=$configured" >> "$GITHUB_OUTPUT"
          [[ "$configured" == true ]] || echo '::notice::Required provider inputs are incomplete or invalid. Provider jobs will not run.'

          # These are separate, deliberately typed repository variables.
          # Federation and valid inputs are not by themselves authorization.
          if [[ "$APPLY_AUTHORIZED" == 'true' ]]; then
            echo 'apply_authorized=true' >> "$GITHUB_OUTPUT"
          else
            echo 'apply_authorized=false' >> "$GITHUB_OUTPUT"
          fi
          if [[ "$ENVIRONMENT_REVIEWERS_VERIFIED" == 'true' ]]; then
            echo 'environment_reviewers_verified=true' >> "$GITHUB_OUTPUT"
          else
            echo 'environment_reviewers_verified=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Production required-reviewer protection is not recorded as verified; apply and rollback are blocked.'
          fi

  # ---------------------------------------------------------------------------
  # Release qualification. Reads evidence; grants nothing.
  # ---------------------------------------------------------------------------
  #
  # `ci.yml` owns the repository gates, container builds and secret scan, and
  # GitHub gives no way for one workflow's job to `needs:` another workflow's.
  # Without this gate `publish` runs on any push to `main` whether or not those
  # checks passed for that commit, which is exactly how an untested commit
  # becomes a published artifact.
  #
  # Qualification is bound to `github.sha` and to nothing else. A check run
  # attached to a different head cannot qualify this one, so a head change
  # invalidates prior qualification by construction rather than by timing. The
  # `infrastructure checks` required check is this workflow's own `checks` job,
  # which `publish` already depends on directly; requiring it here as well would
  # make the run wait on itself.
  #
  # This job reads check results with the default repository token. It touches no
  # provider, holds no OIDC token, and can approve nothing.
  qualify:
    name: release qualification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      checks: read
    outputs:
      qualified_head: ${{ steps.required.outputs.qualified_head }}
    steps:
      - name: Require every required check to have passed on this exact head
        id: required
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          # The required checks owned by `ci.yml`. Renaming one here without
          # renaming the job detaches the gate, so the policy suite asserts both
          # names agree.
          REQUIRED_CHECKS: |
            affected projects and repository gates
            container platform-api
            container web
            secret scan
        run: |
          set -euo pipefail

          mapfile -t required < <(printf '%s' "$REQUIRED_CHECKS" | sed '/^[[:space:]]*$/d')
          [[ "${#required[@]}" -gt 0 ]] || {
            echo 'No required checks are declared; refusing to qualify a release on no evidence.' >&2
            exit 1
          }

          deadline=$(( SECONDS + 20 * 60 ))
          while :; do
            runs="$(
              gh api --paginate \
                -H 'Accept: application/vnd.github+json' \
                "repos/${REPOSITORY}/commits/${HEAD_SHA}/check-runs?per_page=100" \
                --jq '.check_runs[] | [.name, .status, (.conclusion // "pending"), .head_sha] | @tsv'
            )"

            waiting=()
            for name in "${required[@]}"; do
              line="$(awk -F'\t' -v wanted="$name" '$1 == wanted' <<< "$runs" | tail -n 1)"
              if [[ -z "$line" ]]; then
                waiting+=("$name")
                continue
              fi

              status="$(cut -f2 <<< "$line")"
              conclusion="$(cut -f3 <<< "$line")"
              head="$(cut -f4 <<< "$line")"

              # Stale evidence is evidence for another commit. Refuse it rather
              # than letting a passing run from a previous head carry a release.
              if [[ "$head" != "$HEAD_SHA" ]]; then
                echo "Required check \"$name\" is attached to a different head; qualification is per-commit." >&2
                exit 1
              fi
              if [[ "$status" != 'completed' ]]; then
                waiting+=("$name")
                continue
              fi
              # Anything that is not an outright success denies: failure,
              # cancellation, timeout, neutral, skipped and action_required alike.
              if [[ "$conclusion" != 'success' ]]; then
                echo "Required check \"$name\" concluded \"$conclusion\" for this head." >&2
                exit 1
              fi
            done

            [[ "${#waiting[@]}" -eq 0 ]] && break

            if (( SECONDS >= deadline )); then
              echo "Required evidence never completed for this head: ${waiting[*]}." >&2
              exit 1
            fi
            sleep 20
          done

          echo "qualified_head=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          {
            echo '### Release qualification'
            echo
            echo '- qualified head: this workflow run'"'"'s commit'
            echo "- required checks proven: ${#required[@]}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Release vector. Declared manifests in, one ordered forward vector out.
  # ---------------------------------------------------------------------------
  #
  # "CI computes the affected dependency graph from declared manifests and
  # changed contracts; it does not guess from runtime traffic." So this job runs
  # the workspace's own project graph over the range this push introduced, maps
  # the affected projects onto the deployment each one declares in its
  # `project.json`, and emits the ordered vector `deploy` follows.
  #
  # It decides which services are candidates. It authorises none of them: no
  # OIDC token, no environment, no provider input, nothing to exchange.
  release-plan:
    name: release vector
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      count: ${{ steps.vector.outputs.count }}
      plan: ${{ steps.vector.outputs.plan }}
      units: ${{ steps.vector.outputs.units }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.24.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      # Fails closed, because there is no safe default. "Assume everything
      # changed" redeploys a service this commit did not touch, and "assume
      # nothing changed" silently deploys nothing while reporting success.
      - name: Establish the reviewed predecessor of this push
        id: range
        env:
          PREVIOUS_HEAD: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ ! "$PREVIOUS_HEAD" =~ ^[0-9a-f]{40}$ ]] || [[ "$PREVIOUS_HEAD" =~ ^0+$ ]]; then
            echo 'This push declares no previous main commit; the affected range is undecidable.' >&2
            exit 1
          fi
          git cat-file -e "${PREVIOUS_HEAD}^{commit}" 2>/dev/null || {
            echo 'The declared previous commit is not present in this checkout.' >&2
            exit 1
          }
          git merge-base --is-ancestor "$PREVIOUS_HEAD" HEAD || {
            echo 'The declared previous commit is not an ancestor of this head.' >&2
            exit 1
          }
          echo "base=$PREVIOUS_HEAD" >> "$GITHUB_OUTPUT"

      - name: Compute the affected projects from the declared project graph
        env:
          NX_BASE: ${{ steps.range.outputs.base }}
        run: pnpm nx show projects --affected --base="$NX_BASE" --head=HEAD --json > affected.json

      # Refuses rather than guesses: an affected project nothing declares, an
      # ambiguous manifest set, or more targets than the catalog row allows
      # produces no vector at all. See `tools/release/affected-services.mjs`.
      - name: Plan the ordered forward vector
        id: vector
        run: node tools/release/plan-release.mjs --affected affected.json

      - name: Remove the intermediate affected set
        if: always()
        run: rm -f affected.json

  # ---------------------------------------------------------------------------
  # Build once, test and scan that build, publish that exact digest, attest.
  # ---------------------------------------------------------------------------
  #
  # Order is the control. The candidate is built locally, proven to serve its
  # runtime contract, and scanned — all before the registry is reached. Only the
  # digest that survived is pushed, and the published digest is compared against
  # the tested one, so a second build cannot quietly replace the qualified
  # artifact.
  publish:
    name: publish ${{ matrix.project }}
    needs: [checks, authorization, qualify]
    if: >-
      needs.authorization.outputs.federation_configured == 'true' &&
      needs.authorization.outputs.provider_configured == 'true' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.qualify.outputs.qualified_head == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # OIDC token for federation
      attestations: write # build provenance
    strategy:
      fail-fast: true
      matrix:
        include:
          - project: platform-api
            image: platform-api
            service: platform-api
            port: '3001'
            contract_path: /v1/platform/status
            contract_expect: '"schemaVersion":"1"'
          - project: web
            image: web
            service: web
            port: '3000'
            contract_path: /
            contract_expect: '<!DOCTYPE html'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Repository variables are not secrets, so GitHub masks none of their
      # values. Register every configured account identifier as a masked value,
      # which redacts provider output reaching the raw log, and write the same
      # rules to disk for text that reaches a job summary, which is never
      # masked. An unset variable contributes no rule, so a provider-disabled
      # run redacts nothing and still succeeds.
      - name: Mask account identifiers and write the redaction rules
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
          GCP_BILLING_ACCOUNT_ID: ${{ vars.GCP_BILLING_ACCOUNT_ID }}
          GCP_STATE_BUCKET_PREFIX: ${{ vars.GCP_STATE_BUCKET_PREFIX }}
          GCP_BUDGET_ALERT_EMAIL_ADDRESSES_JSON: ${{ vars.GCP_BUDGET_ALERT_EMAIL_ADDRESSES_JSON }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/redact-account-identifiers.py" <<'PY'
          # Replaces every configured account identifier in each named file with
          # its placeholder. Rules arrive longest value first, so redacting a
          # short identifier cannot leave the tail of a longer one behind. A
          # missing file is not an error: a failed render has nothing to redact.
          import json
          import sys
          from pathlib import Path

          rules = json.loads(Path(sys.argv[1]).read_text())
          for name in sys.argv[2:]:
              target = Path(name)
              if not target.exists():
                  continue
              text = target.read_text()
              for value, placeholder in rules:
                  text = text.replace(value, placeholder)
              target.write_text(text)
          PY
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          # The state-bucket prefix is the only account-chosen part of a derived
          # bucket name, so redacting it also redacts every "<prefix>-<stack>"
          # bucket while leaving the public stack name readable.
          NAMED = (
              ('GCP_BILLING_ACCOUNT_ID', '<billing-account-id>'),
              ('GCP_PROJECT_ID', '<project-id>'),
              ('GCP_PROJECT_NUMBER', '<project-number>'),
              ('GCP_STATE_BUCKET_PREFIX', '<state-bucket-prefix>'),
          )

          candidates = [
              (os.environ.get(name, '').strip(), placeholder) for name, placeholder in NAMED
          ]

          raw = os.environ.get('GCP_BUDGET_ALERT_EMAIL_ADDRESSES_JSON', '').strip()
          try:
              addresses = json.loads(raw) if raw else []
          except ValueError:
              addresses = []
          if isinstance(addresses, list):
              candidates += [
                  (str(address).strip(), '<budget-alert-address>') for address in addresses
              ]

          # A value this short would match unrelated plan text. Every real
          # identifier is far longer, so a shorter one is a misconfiguration
          # rather than a usable rule.
          rules = sorted(
              ((value, placeholder) for value, placeholder in candidates if len(value) >= 4),
              key=lambda rule: len(rule[0]),
              reverse=True,
          )

          Path(os.environ['RUNNER_TEMP'], 'account-redactions.json').write_text(json.dumps(rules))
          for value, _ in rules:
              print(f'::add-mask::{value}')
          PY

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.24.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm

      # Attestations are part of the image index, so loading a built image
      # locally needs the containerd image store. Without it the candidate could
      # only be inspected after publication, which is the ordering this job
      # exists to avoid.
      - name: Enable Docker containerd image store
        uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1 # v5
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      # Built locally, not pushed. Nothing reaches the registry until the
      # candidate has served its runtime contract and passed its scan.
      - name: Build the release candidate with provenance and SBOM
        id: build
        env:
          REPOSITORY: ${{ vars.GCP_REGISTRY_HOST }}/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_REGISTRY_REPOSITORY }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          BUILD_WORKFLOW: ${{ github.workflow_ref }}
          BUILD_RUN: ${{ github.run_id }}/${{ github.run_attempt }}
          ARTIFACT_VERSION: git-${{ github.sha }}
        run: |
          set -euo pipefail
          image="$REPOSITORY/${{ matrix.image }}"
          docker buildx build \
            --load \
            --provenance=true \
            --attest=type=sbom,generator=docker.io/docker/buildkit-syft-scanner@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9 \
            --build-arg SOURCE_REPOSITORY="$SOURCE_REPOSITORY" \
            --build-arg SOURCE_COMMIT="$SOURCE_COMMIT" \
            --build-arg SOURCE_REF="$SOURCE_REF" \
            --build-arg BUILD_WORKFLOW="$BUILD_WORKFLOW" \
            --build-arg BUILD_RUN="$BUILD_RUN" \
            --build-arg ARTIFACT_VERSION="$ARTIFACT_VERSION" \
            --file ${{ matrix.project == 'web' && 'apps/web' || 'services/platform-api' }}/Dockerfile \
            --tag "$image:${{ github.sha }}" \
            --metadata-file metadata.json \
            .
          digest="$(jq -r '."containerimage.digest"' metadata.json)"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Build did not report a digest." >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "artifact_version=$ARTIFACT_VERSION" >> "$GITHUB_OUTPUT"

      # Image-level acceptance against the exact digest that will be scanned and
      # promoted. The runtime contract injected here is the one the deployment
      # injects, so an image that cannot start under it fails before publication
      # rather than after a Cloud Run revision has been created.
      - name: Prove the candidate digest serves its runtime contract
        env:
          IMAGE: ${{ steps.build.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          ARTIFACT_VERSION: ${{ steps.build.outputs.artifact_version }}
          SOURCE_COMMIT: ${{ github.sha }}
          SERVICE_NAME: ${{ matrix.service }}
          SERVICE_PORT: ${{ matrix.port }}
          CONTRACT_PATH: ${{ matrix.contract_path }}
          CONTRACT_EXPECT: ${{ matrix.contract_expect }}
        run: |
          set -euo pipefail
          reference="$IMAGE@$DIGEST"

          # A reserved-for-testing origin: the probe must never depend on, or
          # reach, a real service (RFC 2606).
          container="$(
            docker run --detach --rm \
              --env NODE_ENV=production \
              --env MONEY_NOODLE_SERVICE="$SERVICE_NAME" \
              --env MONEY_NOODLE_ENVIRONMENT=production \
              --env MONEY_NOODLE_COMMIT="$SOURCE_COMMIT" \
              --env ARTIFACT_VERSION="$ARTIFACT_VERSION" \
              --env PLATFORM_API_ORIGIN='https://platform-api.invalid' \
              --publish "127.0.0.1:0:${SERVICE_PORT}" \
              "$reference"
          )"
          trap 'docker stop "$container" >/dev/null 2>&1 || true' EXIT

          # The image declares its own HEALTHCHECK, so wait for that verdict
          # rather than inventing a second definition of healthy.
          health='starting'
          for _ in $(seq 1 60); do
            health="$(docker inspect --format '{{.State.Health.Status}}' "$container")"
            [[ "$health" == 'healthy' ]] && break
            if [[ "$health" == 'unhealthy' ]]; then
              echo 'The release candidate reported itself unhealthy.' >&2
              exit 1
            fi
            sleep 2
          done
          if [[ "$health" != 'healthy' ]]; then
            echo 'The release candidate never became healthy under the production runtime contract.' >&2
            exit 1
          fi

          port="$(docker port "$container" "${SERVICE_PORT}/tcp" | head -n 1 | sed 's/.*://')"
          ready="$(curl --fail --silent --show-error "http://127.0.0.1:${port}/health/ready")"
          grep -Fq '"status":"ready"' <<< "$ready"
          # An attributable version, not merely a process that answers.
          grep -Fq "\"version\":\"$ARTIFACT_VERSION\"" <<< "$ready"

          contract="$(curl --fail --silent --show-error "http://127.0.0.1:${port}${CONTRACT_PATH}")"
          grep -Fq "$CONTRACT_EXPECT" <<< "$contract"

          # The artifact must name the commit it was built from, so a digest can
          # be traced to its source without an external lookup.
          revision="$(
            docker image inspect \
              --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$reference"
          )"
          if [[ "$revision" != "$SOURCE_COMMIT" ]]; then
            echo 'The candidate image does not carry this run'"'"'s source commit.' >&2
            exit 1
          fi

          echo "The candidate digest served its runtime contract and names this source commit."

      # Scanning gates publication. A HIGH or CRITICAL finding stops the release
      # here, with nothing in the registry to withdraw.
      - name: Scan the candidate digest before publication
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.build.outputs.image }}@${{ steps.build.outputs.digest }}
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      # Short-lived credentials by OIDC exchange, obtained only once the
      # candidate has qualified. No provider key is stored in GitHub, in the
      # repository, in an image, or on any machine (ADR-0005).
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          audience: money-noodle-delivery
          token_format: access_token

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.GCP_REGISTRY_HOST }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      # Push the artifact that was tested and scanned, then prove the registry
      # holds that exact digest. A rebuild between test and publication would
      # produce a different digest and stop here.
      - name: Publish the tested digest and prove it is the one in the registry
        id: publish
        env:
          IMAGE: ${{ steps.build.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker push "$IMAGE:${{ github.sha }}"

          published="$(
            docker buildx imagetools inspect "$IMAGE:${{ github.sha }}" \
              --format '{{.Manifest.Digest}}'
          )"
          if [[ "$published" != "$DIGEST" ]]; then
            echo 'The published digest is not the digest that was tested and scanned.' >&2
            exit 1
          fi
          echo "digest=$published" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.build.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

  # ---------------------------------------------------------------------------
  # Deploy. The qualifying merge is the deployment; the environment gate is
  # still the production decision.
  # ---------------------------------------------------------------------------
  #
  # This is the missing piece of the CD path. `apply` deploys a stack a person
  # typed a phrase for; this deploys the vector the merge itself produced, with
  # no `workflow_dispatch` anywhere in its guard. What it does not do is decide:
  # `environment: production` still holds the run at the maintainer's gate, and
  # nothing here can approve, request or assume that approval (#74).
  #
  # Three properties this job is built around.
  #
  #   * Nothing is rebuilt for promotion. The digest behind this commit's
  #     published tag is deployed only after `gh attestation verify` binds it to
  #     this repository, this exact signer workflow and this source commit.
  #   * The order is the declared order, and verification is between the steps
  #     rather than after them. A failed API verification stops the job before
  #     web is touched, which is what "leaves the candidate blocked, leaves
  #     unaffected services untouched" means in practice.
  #   * It is forward only. `service.rollback` needs a verified predecessor,
  #     which cannot exist before a first deployment, so no path here names a
  #     rollback revision or spends a recovery slot. Recovery is #155.
  deploy:
    name: deploy release vector
    needs: [checks, authorization, qualify, publish, release-plan]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.qualify.outputs.qualified_head == github.sha &&
      needs.release-plan.outputs.count != '0' &&
      needs.authorization.outputs.federation_configured == 'true' &&
      needs.authorization.outputs.provider_configured == 'true' &&
      needs.authorization.outputs.apply_authorized == 'true' &&
      needs.authorization.outputs.environment_reviewers_verified == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_bootstrap_state_bucket: ${{ format('{0}-bootstrap', vars.GCP_STATE_BUCKET_PREFIX) }}
      TF_VAR_platform_state_bucket: ${{ format('{0}-platform', vars.GCP_STATE_BUCKET_PREFIX) }}
      TF_VAR_api_state_bucket: ${{ format('{0}-api', vars.GCP_STATE_BUCKET_PREFIX) }}
      TF_VAR_project_number: ${{ vars.GCP_PROJECT_NUMBER }}
      TF_VAR_billing_account_id: ${{ vars.GCP_BILLING_ACCOUNT_ID }}
      TF_VAR_budget_alert_email_addresses: ${{ vars.GCP_BUDGET_ALERT_EMAIL_ADDRESSES_JSON }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Mask account identifiers and write the redaction rules
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
          GCP_BILLING_ACCOUNT_ID: ${{ vars.GCP_BILLING_ACCOUNT_ID }}
          GCP_STATE_BUCKET_PREFIX: ${{ vars.GCP_STATE_BUCKET_PREFIX }}
          GCP_BUDGET_ALERT_EMAIL_ADDRESSES_JSON: ${{ vars.GCP_BUDGET_ALERT_EMAIL_ADDRESSES_JSON }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/redact-account-identifiers.py" <<'PY'
          # Replaces every configured account identifier in each named file with
          # its placeholder. Rules arrive longest value first, so redacting a
          # short identifier cannot leave the tail of a longer one behind. A
          # missing file is not an error: a failed render has nothing to redact.
          import json
          import sys
          from pathlib import Path

          rules = json.loads(Path(sys.argv[1]).read_text())
          for name in sys.argv[2:]:
              target = Path(name)
              if not target.exists():
                  continue
              text = target.read_text()
              for value, placeholder in rules:
                  text = text.replace(value, placeholder)
              target.write_text(text)
          PY
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          # The state-bucket prefix is the only account-chosen part of a derived
          # bucket name, so redacting it also redacts every "<prefix>-<stack>"
          # bucket while leaving the public stack name readable.
          NAMED = (
              ('GCP_BILLING_ACCOUNT_ID', '<billing-account-id>'),
              ('GCP_PROJECT_ID', '<project-id>'),
              ('GCP_PROJECT_NUMBER', '<project-number>'),
              ('GCP_STATE_BUCKET_PREFIX', '<state-bucket-prefix>'),
          )

          candidates = [
              (os.environ.get(name, '').strip(), placeholder) for name, placeholder in NAMED
          ]

          raw = os.environ.get('GCP_BUDGET_ALERT_EMAIL_ADDRESSES_JSON', '').strip()
          try:
              addresses = json.loads(raw) if raw else []
          except ValueError:
              addresses = []
          if isinstance(addresses, list):
              candidates += [
                  (str(address).strip(), '<budget-alert-address>') for address in addresses
              ]

          # A value this short would match unrelated plan text. Every real
          # identifier is far longer, so a shorter one is a misconfiguration
          # rather than a usable rule.
          rules = sorted(
              ((value, placeholder) for value, placeholder in candidates if len(value) >= 4),
              key=lambda rule: len(rule[0]),
              reverse=True,
          )

          Path(os.environ['RUNNER_TEMP'], 'account-redactions.json').write_text(json.dumps(rules))
          for value, _ in rules:
              print(f'::add-mask::{value}')
          PY

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      # `imagetools inspect` resolves the published tag to its digest, which is
      # how this job reads what `publish` pushed without rebuilding anything.
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - id: deploy-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          audience: money-noodle-delivery
          token_format: access_token

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.GCP_REGISTRY_HOST }}
          username: oauth2accesstoken
          password: ${{ steps.deploy-auth.outputs.access_token }}

      # Every digest for the whole vector is resolved and verified before any of
      # it is deployed, so a half-deployed vector cannot be the way an
      # unverifiable artifact is discovered.
      - name: Resolve and verify the artifacts this commit published
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY: ${{ vars.GCP_REGISTRY_HOST }}/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_REGISTRY_REPOSITORY }}
          RELEASE_PLAN: ${{ needs.release-plan.outputs.plan }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'A full source commit is required.' >&2
            exit 1
          }
          artifacts="$RUNNER_TEMP/release-artifacts.json"
          printf '{}' > "$artifacts"

          for unit in $(jq -r '.vector[].unit' <<< "$RELEASE_PLAN"); do
            name="$(jq -r --arg unit "$unit" '.vector[] | select(.unit == $unit) | .image' <<< "$RELEASE_PLAN")"
            image="$REGISTRY/$name"
            # The tag is a lookup, never the thing deployed. What is deployed is
            # the digest behind it, and only after provenance binds that digest
            # to this repository, this signer workflow and this source commit.
            digest="$(docker buildx imagetools inspect "$image:$SOURCE_COMMIT" --format '{{.Manifest.Digest}}')"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "No deployable digest was published for $unit; a tag is not deployable." >&2
              exit 1
            }
            gh attestation verify "oci://${image}@${digest}" \
              --repo "${{ github.repository }}" \
              --signer-workflow "${{ github.repository }}/.github/workflows/delivery.yml" \
              --source-digest "$SOURCE_COMMIT" \
              --source-ref refs/heads/main \
              --deny-self-hosted-runners \
              --predicate-type https://slsa.dev/provenance/v1
            jq --arg unit "$unit" --arg digest "$digest" '.[$unit] = $digest' "$artifacts" > "$artifacts.next"
            mv "$artifacts.next" "$artifacts"
          done

          echo "Verified $(jq -r 'length' "$artifacts") artifact(s) against this commit's provenance."

      # --- api, then its verification, then web ---------------------------------
      #
      # Declared order, enforced by position. Steps run in sequence and a failed
      # step ends the job, so web is only reached once the API it depends on has
      # been deployed and independently probed.
      - name: Deploy api
        if: contains(fromJSON(needs.release-plan.outputs.units), 'api')
        working-directory: infra/stacks/api
        env:
          STATE_BUCKET_PREFIX: ${{ vars.GCP_STATE_BUCKET_PREFIX }}
          TF_VAR_artifact_version: git-${{ github.sha }}
          TF_VAR_source_commit: ${{ github.sha }}
          TF_VAR_revision_suffix: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          TF_VAR_image_digest="$(jq -er '.api' "$RUNNER_TEMP/release-artifacts.json")"
          export TF_VAR_image_digest
          tofu init -input=false \
            -backend-config="bucket=${STATE_BUCKET_PREFIX}-api" \
            -backend-config="prefix=stacks/api"
          # Plan and apply the same plan file, so what was planned is what runs.
          tofu plan -input=false -lock-timeout=5m -out=stack.tfplan
          tofu apply -input=false -lock-timeout=5m -auto-approve stack.tfplan
          rm -f stack.tfplan

      - id: deploy-api-service
        name: Read the deployed api service URI
        if: contains(fromJSON(needs.release-plan.outputs.units), 'api')
        working-directory: infra/stacks/api
        run: |
          set -euo pipefail
          echo "uri=$(tofu output -raw contract_service_uri)" >> "$GITHUB_OUTPUT"

      # The service is created private, so an anonymous probe is refused. Mint a
      # short-lived ID token for the same federated deployer, bound to this
      # service as its audience. The action masks the token.
      - id: deploy-api-probe-auth
        if: contains(fromJSON(needs.release-plan.outputs.units), 'api')
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          audience: money-noodle-delivery
          create_credentials_file: false
          token_format: id_token
          id_token_audience: ${{ steps.deploy-api-service.outputs.uri }}

      - name: Verify api health and the published contract
        if: contains(fromJSON(needs.release-plan.outputs.units), 'api')
        env:
          SERVICE_URI: ${{ steps.deploy-api-service.outputs.uri }}
          PROBE_ID_TOKEN: ${{ steps.deploy-api-probe-auth.outputs.id_token }}
        run: |
          set -euo pipefail
          # The header is read from stdin so the token is never a process argument.
          for path in /health/live /health/ready; do
            code="$(printf 'Authorization: Bearer %s\n' "$PROBE_ID_TOKEN" |
              curl -sS -o /dev/null -w '%{http_code}' --retry 6 --retry-delay 5 \
                --retry-all-errors --max-time 20 -H @- "${SERVICE_URI}${path}")"
            [[ "$code" == '200' ]] || { echo "${path} returned ${code}" >&2; exit 1; }
          done
          printf 'Authorization: Bearer %s\n' "$PROBE_ID_TOKEN" |
            curl -sSf --max-time 20 -H @- "${SERVICE_URI}/v1/platform/status" |
            jq -e '.state and .asOf and .schemaVersion == "1"' > /dev/null

      - name: Deploy web
        if: contains(fromJSON(needs.release-plan.outputs.units), 'web')
        working-directory: infra/stacks/web
        env:
          STATE_BUCKET_PREFIX: ${{ vars.GCP_STATE_BUCKET_PREFIX }}
          TF_VAR_artifact_version: git-${{ github.sha }}
          TF_VAR_source_commit: ${{ github.sha }}
          TF_VAR_revision_suffix: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          TF_VAR_image_digest="$(jq -er '.web' "$RUNNER_TEMP/release-artifacts.json")"
          export TF_VAR_image_digest
          tofu init -input=false \
            -backend-config="bucket=${STATE_BUCKET_PREFIX}-web" \
            -backend-config="prefix=stacks/web"
          tofu plan -input=false -lock-timeout=5m -out=stack.tfplan
          tofu apply -input=false -lock-timeout=5m -auto-approve stack.tfplan
          rm -f stack.tfplan

      - id: deploy-web-service
        name: Read the deployed web service URI
        if: contains(fromJSON(needs.release-plan.outputs.units), 'web')
        working-directory: infra/stacks/web
        run: |
          set -euo pipefail
          echo "uri=$(tofu output -raw contract_service_uri)" >> "$GITHUB_OUTPUT"

      - id: deploy-web-probe-auth
        if: contains(fromJSON(needs.release-plan.outputs.units), 'web')
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          audience: money-noodle-delivery
          create_credentials_file: false
          token_format: id_token
          id_token_audience: ${{ steps.deploy-web-service.outputs.uri }}

      - name: Verify web health
        if: contains(fromJSON(needs.release-plan.outputs.units), 'web')
        env:
          SERVICE_URI: ${{ steps.deploy-web-service.outputs.uri }}
          PROBE_ID_TOKEN: ${{ steps.deploy-web-probe-auth.outputs.id_token }}
        run: |
          set -euo pipefail
          for path in /health/live /health/ready; do
            code="$(printf 'Authorization: Bearer %s\n' "$PROBE_ID_TOKEN" |
              curl -sS -o /dev/null -w '%{http_code}' --retry 6 --retry-delay 5 \
                --retry-all-errors --max-time 20 -H @- "${SERVICE_URI}${path}")"
            [[ "$code" == '200' ]] || { echo "${path} returned ${code}" >&2; exit 1; }
          done

      # The record is the ordered vector, what was left alone and what was
      # verified. It names no service URI, digest or account identifier, because
      # a job summary is public and is never masked.
      - name: Record the ordered vector and its verification
        env:
          RELEASE_PLAN: ${{ needs.release-plan.outputs.plan }}
        run: |
          set -euo pipefail
          {
            echo '### Deployed release vector'
            echo
            echo "- source commit: \`${{ github.sha }}\`"
            echo "- operation: \`$(jq -r '.operation' <<< "$RELEASE_PLAN")\`"
            echo "- permission slots: \`$(jq -r '.permissionSlots | join(", ")' <<< "$RELEASE_PLAN")\`"
            echo "- ordered vector: $(jq -r '[.vector[].unit] | join(" then ")' <<< "$RELEASE_PLAN")"
            echo "- left unchanged: $(jq -r 'if (.unaffected | length) == 0 then "none" else (.unaffected | join(", ")) end' <<< "$RELEASE_PLAN")"
            echo '- verified per step: readiness and liveness, plus the published contract for the API'
            echo '- predecessor evidence: none, so no rollback permission exists or was minted'
            echo "- workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Plan. Evidence, never authorisation.
  # ---------------------------------------------------------------------------
  #
  # DEVIATION FROM ADR-0006, recorded rather than hidden. That decision expects
  # "pull requests run `plan` for affected stacks and publish the plan for
  # review". This job does not run on `pull_request`, because planning reads
  # remote state, state is sensitive by default even when no secret was declared,
  # and ADR-0005 requires that a token minted for a pull request — including one
  # from a fork — not be exchangeable for provider authority. Granting PR runs
  # the credential needed to plan would disclose state to anyone who can open a
  # pull request.
  #
  # Closing the gap properly needs a second, read-only planner workload identity bound
  # to same-repository pull requests only. That is a bounded follow-up, listed in
  # `infra/README.md`. Until then pull requests get the full static check suite,
  # which needs no credential at all.
  plan:
    name: plan ${{ matrix.stack }}
    needs: [checks, authorization]
    if: >-
      needs.authorization.outputs.federation_configured == 'true' &&
      needs.authorization.outputs.provider_configured == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'plan'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # A push checks shared platform drift. Service plans require an explicit
        # digest/source pair and therefore run only for the selected dispatch.
        stack: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', github.event.inputs.stack) || '["platform"]') }}
    env:
      TF_VAR_bootstrap_state_bucket: ${{ format('{0}-bootstrap', vars.GCP_STATE_BUCKET_PREFIX) }}
      TF_VAR_platform_state_bucket: ${{ format('{0}-platform', vars.GCP_STATE_BUCKET_PREFIX) }}
      TF_VAR_api_state_bucket: ${{ format('{0}-api', vars.GCP_STATE_BUCKET_PREFIX) }}
      TF_VAR_project_number: ${{ vars.GCP_PROJECT_NUMBER }}
      TF_VAR_billing_account_id: ${{ vars.GCP_BILLING_ACCOUNT_ID }}
      TF_VAR_budget_alert_email_addresses: ${{ vars.GCP_BUDGET_ALERT_EMAIL_ADDRESSES_JSON }}
      TF_VAR_image_digest: ${{ github.event.inputs.image_digest }}
      TF_VAR_artifact_version: ${{ github.event.inputs.source_commit }}
      TF_VAR_source_commit: ${{ github.event.inputs.source_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Repository variables are not secrets, so GitHub masks none of their
      # values. Register every configured account identifier as a masked value,
      # which redacts provider output reaching the raw log, and write the same
      # rules to disk for text that reaches a job summary, which is never
      # masked. An unset variable contributes no rule, so a provider-disabled
      # run redacts nothing and still succeeds.
      - name: Mask account identifiers and write the redaction rules
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
          GCP_BILLING_ACCOUNT_ID: ${{ vars.GCP_BILLING_ACCOUNT_ID }}
          GCP_STATE_BUCKET_PREFIX: ${{ vars.GCP_STATE_BUCKET_PREFIX }}
          GCP_BUDGET_ALERT_EMAIL_ADDRESSES_JSON: ${{ vars.GCP_BUDGET_ALERT_EMAIL_ADDRESSES_JSON }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/redact-account-identifiers.py" <<'PY'
          # Replaces every configured account identifier in each named file with
          # its placeholder. Rules arrive longest value first, so redacting a
          # short identifier cannot leave the tail of a longer one behind. A
          # missing file is not an error: a failed render has nothing to redact.
          import json
          import sys
          from pathlib import Path

          rules = json.loads(Path(sys.argv[1]).read_text())
          for name in sys.argv[2:]:
              target = Path(name)
              if not target.exists():
                  continue
              text = target.read_text()
              for value, placeholder in rules:
                  text = text.replace(value, placeholder)
              target.write_text(text)
          PY
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          # The state-bucket prefix is the only account-chosen part of a derived
          # bucket name, so redacting it also redacts every "<prefix>-<stack>"
          # bucket while leaving the public stack name readable.
          NAMED = (
              ('GCP_BILLING_ACCOUNT_ID', '<billing-account-id>'),
              ('GCP_PROJECT_ID', '<project-id>'),
              ('GCP_PROJECT_NUMBER', '<project-number>'),
              ('GCP_STATE_BUCKET_PREFIX', '<state-bucket-prefix>'),
          )

          candidates = [
              (os.environ.get(name, '').strip(), placeholder) for name, placeholder in NAMED
          ]

          raw = os.environ.get('GCP_BUDGET_ALERT_EMAIL_ADDRESSES_JSON', '').strip()
          try:
              addresses = json.loads(raw) if raw else []
          except ValueError:
              addresses = []
          if isinstance(addresses, list):
              candidates += [
                  (str(address).strip(), '<budget-alert-address>') for address in addresses
              ]

          # A value this short would match unrelated plan text. Every real
          # identifier is far longer, so a shorter one is a misconfiguration
          # rather than a usable rule.
          rules = sorted(
              ((value, placeholder) for value, placeholder in candidates if len(value) >= 4),
              key=lambda rule: len(rule[0]),
              reverse=True,
          )

          Path(os.environ['RUNNER_TEMP'], 'account-redactions.json').write_text(json.dumps(rules))
          for value, _ in rules:
              print(f'::add-mask::{value}')
          PY

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - id: plan-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          audience: money-noodle-delivery
          token_format: access_token

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: matrix.stack != 'platform'
        with:
          registry: ${{ vars.GCP_REGISTRY_HOST }}
          username: oauth2accesstoken
          password: ${{ steps.plan-auth.outputs.access_token }}

      - name: Verify selected service artifact
        if: matrix.stack != 'platform'
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ vars.GCP_REGISTRY_HOST }}/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_REGISTRY_REPOSITORY }}/${{ matrix.stack == 'web' && 'web' || 'platform-api' }}
          DIGEST: ${{ github.event.inputs.image_digest }}
          SOURCE_COMMIT: ${{ github.event.inputs.source_commit }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo 'A full image digest is required.' >&2; exit 1; }
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo 'A full source commit is required.' >&2; exit 1; }
          gh attestation verify "oci://${IMAGE}@${DIGEST}" \
            --repo "${{ github.repository }}" \
            --signer-workflow "${{ github.repository }}/.github/workflows/delivery.yml" \
            --source-digest "$SOURCE_COMMIT" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners \
            --predicate-type https://slsa.dev/provenance/v1

      - name: Plan
        working-directory: infra/stacks/${{ matrix.stack }}
        env:
          STATE_BUCKET_PREFIX: ${{ vars.GCP_STATE_BUCKET_PREFIX }}
          STACK: ${{ matrix.stack }}
        run: |
          set -euo pipefail
          tofu init -input=false \
            -backend-config="bucket=${STATE_BUCKET_PREFIX}-${{ matrix.stack }}" \
            -backend-config="prefix=stacks/${{ matrix.stack }}"
          # `-lock-timeout` waits for a concurrent operation rather than failing
          # immediately or, worse, proceeding without the lock.
          tofu plan -input=false -lock-timeout=5m -out=stack.tfplan
          # Rendered without values that state may hold; the binary plan is never
          # uploaded as an artifact.
          tofu show -no-color stack.tfplan > plan.txt
