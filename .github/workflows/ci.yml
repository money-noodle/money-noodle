name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  foundation:
    name: foundation guidance and coordination
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check coordination tools
        run: |
          node --check tools/coordination-lib.mjs
          node --check tools/coordination-status.mjs
          node --check tools/verify-doc-links.mjs

      - name: Test coordination logic
        run: node --test tools/coordination-lib.test.mjs

      - name: Verify documentation links
        run: node tools/verify-doc-links.mjs

      - name: Verify harness entry points
        run: |
          grep -Fx '@AGENTS.md' CLAUDE.md
          grep -F 'AGENTS.md' .github/copilot-instructions.md
