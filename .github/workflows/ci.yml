name: CI

on:
  push:
    branches: ['**']
  pull_request:
  # After publication and Actions enablement, this is the one-time full-snapshot
  # baseline path. It is main-only and the secret job proves nonzero coverage.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  foundation:
    name: affected projects and repository gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.24.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Select affected base
        id: affected
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            # A manual run is the post-publication baseline, not an affected-only
            # optimization. The empty tree makes every snapshot path affected,
            # including the sole root commit.
            base="$(git hash-object -t tree /dev/null)"
          elif [[ -n "$PR_BASE" ]]; then
            base="$PR_BASE"
          elif [[ -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]]; then
            base="$BEFORE"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            base="HEAD^"
          else
            base="$(git hash-object -t tree /dev/null)"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Verify runtime, formatting, guidance, and coordination
        run: |
          pnpm verify:runtime
          pnpm format:check
          pnpm verify:foundation
          pnpm verify:boundaries
          grep -Fx '@AGENTS.md' CLAUDE.md
          grep -F 'AGENTS.md' .github/copilot-instructions.md

      - name: Verify affected project boundaries
        env:
          NX_BASE: ${{ steps.affected.outputs.base }}
        run: pnpm nx affected -t lint,typecheck,test,contract,build --base="$NX_BASE" --head=HEAD

      - name: Audit dependencies
        run: pnpm audit --audit-level high

  infrastructure-baseline:
    name: manual OpenTofu baseline
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: '1.12.6'
          tofu_wrapper: false

      - name: Format, validate, and test every module and stack
        run: node tools/infra-check.mjs all

      - name: Prove the manual infrastructure baseline had no provider credential
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${GOOGLE_APPLICATION_CREDENTIALS:-}" ]]; then
            echo 'A credential path was present during the manual infrastructure baseline.' >&2
            exit 1
          fi
          if compgen -G "$HOME/.config/gcloud/*" > /dev/null; then
            echo 'Provider credentials were present during the manual infrastructure baseline.' >&2
            exit 1
          fi
          echo 'Manual OpenTofu checks ran with no provider credential available.'

  containers:
    name: container ${{ matrix.project }}
    needs: foundation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # A pull request from a fork runs here. It builds and scans an image and
    # gets nothing else: no provider token, no environment, no write.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: platform-api
            image: money-noodle/platform-api:local
            service: platform-api
            port: '3001'
            contract_path: /v1/platform/status
            contract_expect: '"schemaVersion":"1"'
          - project: web
            image: money-noodle/web:local
            service: web
            port: '3000'
            contract_path: /
            contract_expect: '<!DOCTYPE html'
            # The packaged-artifact journey needs both images, so it runs once,
            # in this leg. It stays inside an existing required check because
            # `delivery.yml` qualifies a release on exactly these four check
            # names; a fifth would have to be added to the protection rules
            # before it could gate anything.
            journey: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.24.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Enable Docker containerd image store
        uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Build attributable OCI image with provenance and SBOM
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          BUILD_WORKFLOW: ${{ github.workflow_ref }}
          BUILD_RUN: ${{ github.run_id }}/${{ github.run_attempt }}
          ARTIFACT_VERSION: git-${{ github.sha }}
        run: pnpm nx run ${{ matrix.project }}:container

      # The image this job scans is the image this job just proved serves its
      # runtime contract. The same acceptance runs against the release candidate
      # in `delivery.yml` before publication, so a container that cannot start
      # is caught on the pull request rather than at release time.
      - name: Prove the built image serves its runtime contract
        env:
          IMAGE: ${{ matrix.image }}
          ARTIFACT_VERSION: git-${{ github.sha }}
          SOURCE_COMMIT: ${{ github.sha }}
          SERVICE_NAME: ${{ matrix.service }}
          SERVICE_PORT: ${{ matrix.port }}
          CONTRACT_PATH: ${{ matrix.contract_path }}
          CONTRACT_EXPECT: ${{ matrix.contract_expect }}
        run: |
          set -euo pipefail

          # A reserved-for-testing origin: the probe must never depend on, or
          # reach, a real service (RFC 2606).
          container="$(
            docker run --detach --rm \
              --env NODE_ENV=production \
              --env MONEY_NOODLE_SERVICE="$SERVICE_NAME" \
              --env MONEY_NOODLE_ENVIRONMENT=production \
              --env MONEY_NOODLE_COMMIT="$SOURCE_COMMIT" \
              --env ARTIFACT_VERSION="$ARTIFACT_VERSION" \
              --env PLATFORM_API_ORIGIN='https://platform-api.invalid' \
              --publish "127.0.0.1:0:${SERVICE_PORT}" \
              "$IMAGE"
          )"
          trap 'docker stop "$container" >/dev/null 2>&1 || true' EXIT

          health='starting'
          for _ in $(seq 1 60); do
            health="$(docker inspect --format '{{.State.Health.Status}}' "$container")"
            [[ "$health" == 'healthy' ]] && break
            if [[ "$health" == 'unhealthy' ]]; then
              echo 'The built image reported itself unhealthy.' >&2
              exit 1
            fi
            sleep 2
          done
          if [[ "$health" != 'healthy' ]]; then
            echo 'The built image never became healthy under the production runtime contract.' >&2
            exit 1
          fi

          port="$(docker port "$container" "${SERVICE_PORT}/tcp" | head -n 1 | sed 's/.*://')"
          ready="$(curl --fail --silent --show-error "http://127.0.0.1:${port}/health/ready")"
          grep -Fq '"status":"ready"' <<< "$ready"
          grep -Fq "\"version\":\"$ARTIFACT_VERSION\"" <<< "$ready"

          contract="$(curl --fail --silent --show-error "http://127.0.0.1:${port}${CONTRACT_PATH}")"
          grep -Fq "$CONTRACT_EXPECT" <<< "$contract"

          revision="$(
            docker image inspect \
              --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE"
          )"
          if [[ "$revision" != "$SOURCE_COMMIT" ]]; then
            echo 'The built image does not carry this run'"'"'s source commit.' >&2
            exit 1
          fi

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      # The other half of the journey's pair. Built here rather than carried
      # between jobs, because an artifact that crosses a job boundary is no
      # longer obviously the artifact this job built and scanned.
      - name: Build the API artifact the journey runs against
        if: matrix.journey
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          BUILD_WORKFLOW: ${{ github.workflow_ref }}
          BUILD_RUN: ${{ github.run_id }}/${{ github.run_attempt }}
          ARTIFACT_VERSION: git-${{ github.sha }}
        run: pnpm nx run platform-api:container

      # Exact-version and lockfile-pinned: the browser revision is the one this
      # Playwright release declares, not whatever a runner image happens to
      # carry. Nothing here needs a credential, so a fork's pull request runs it
      # exactly as `main` does.
      - name: Install the pinned journey browser
        if: matrix.journey
        run: pnpm exec playwright install --with-deps chromium

      # Drives the images this job built: accessible state, the same
      # API-provided timestamp the page received, and status unknown for every
      # upstream failure family. Failure fails this required check.
      - name: Run the packaged-artifact release journey
        if: matrix.journey
        env:
          MONEY_NOODLE_RELEASE_JOURNEY: '1'
          MONEY_NOODLE_JOURNEY_API_IMAGE: money-noodle/platform-api:local
          MONEY_NOODLE_JOURNEY_WEB_IMAGE: ${{ matrix.image }}
          MONEY_NOODLE_JOURNEY_COMMIT: ${{ github.sha }}
          MONEY_NOODLE_JOURNEY_ARTIFACT_VERSION: git-${{ github.sha }}
        run: node --test tools/release.test.mjs

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: '8.24.3'
      # Official v8.24.3 checksums manifest; independently matched against the
      # downloaded Linux x64 archive before publication.
      GITLEAKS_LINUX_X64_SHA256: '9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Establish the manual full-history baseline
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || {
            echo 'The manual baseline must run from main.' >&2
            exit 1
          }
          commit_count="$(git rev-list --count --all)"
          snapshot_path_count="$(
            git rev-list --max-parents=0 --all |
              while read -r root; do
                git diff-tree --root --no-commit-id --name-only -r "$root"
              done |
              sort -u |
              awk 'NF { count += 1 } END { print count + 0 }'
          )"
          [[ "$commit_count" -gt 0 && "$snapshot_path_count" -gt 0 ]] || {
            echo "Secret baseline coverage is empty: commits=$commit_count snapshot_paths=$snapshot_path_count" >&2
            exit 1
          }
          {
            echo '### Secret-scan baseline inputs'
            echo
            echo "- reachable commits: $commit_count"
            echo "- root-snapshot paths: $snapshot_path_count"
            echo '- scanner acceptance: the following step must report nonzero commits and bytes'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          archive="$RUNNER_TEMP/$asset"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${asset}" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$archive" |
            sha256sum --check --strict -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan full reachable history and require nonzero evidence
        shell: bash
        run: |
          set -euo pipefail
          scan_log="$RUNNER_TEMP/gitleaks.log"
          report="$RUNNER_TEMP/gitleaks.sarif"
          trap 'rm -f "$scan_log" "$report"' EXIT

          set +e
          "$RUNNER_TEMP/gitleaks" detect \
            --source=. \
            --redact \
            --no-banner \
            --exit-code=2 \
            --report-format=sarif \
            --report-path="$report" \
            --log-level=info \
            --log-opts='--all' > "$scan_log" 2>&1
          status=$?
          set -e

          if [[ "$status" -ne 0 ]]; then
            echo 'Secret scan failed or found a potential secret; findings are withheld from logs.' >&2
            exit "$status"
          fi

          scanned_commits="$(
            grep -Eo '[0-9]+ commits scanned\.' "$scan_log" |
              tail -n 1 |
              grep -Eo '^[0-9]+' || true
          )"
          scanned_bytes="$(
            grep -Eo 'scanned ~[0-9]+ bytes' "$scan_log" |
              tail -n 1 |
              grep -Eo '[0-9]+' || true
          )"
          if [[ ! "$scanned_commits" =~ ^[1-9][0-9]*$ || ! "$scanned_bytes" =~ ^[1-9][0-9]*$ ]]; then
            echo 'Secret scan did not prove nonzero commit and byte coverage; scanner output is withheld.' >&2
            exit 1
          fi

          echo "Gitleaks scanned $scanned_commits commits and $scanned_bytes bytes; no leaks found."
          {
            echo '### Secret-scan evidence'
            echo
            echo "- commits scanned: $scanned_commits"
            echo "- bytes scanned: $scanned_bytes"
            echo '- findings: none'
          } >> "$GITHUB_STEP_SUMMARY"
