name: Parallel work item
description: Create a claimable unit linked to a shared plan.
title: "Work: "
labels:
  - work:proposed
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        New work starts proposed and unclaimed. Use the claim protocol rather than editing ownership during creation. Do not include local paths or sensitive information.
  - type: input
    id: parent_plan
    attributes:
      label: Parent-Plan
      description: Optional parent plan issue reference.
      placeholder: "#ISSUE or none"
    validations:
      required: false
  - type: textarea
    id: outcome_scope
    attributes:
      label: Outcome and scope
      description: State one independently verifiable outcome and exclusions.
    validations:
      required: true
  - type: textarea
    id: scope_paths
    attributes:
      label: Scope-Paths
      description: Exact repository-relative paths, directory/**, root **, or none; one entry per line.
      placeholder: |
        docs/example.md
        .github/example/**
    validations:
      required: true
  - type: input
    id: depends_on
    attributes:
      label: Depends-On
      description: Issue references or none.
      value: none
    validations:
      required: true
  - type: textarea
    id: dependency_notes
    attributes:
      label: Dependency-Notes
      description: Optional dependency explanation.
    validations:
      required: false
  - type: input
    id: claim_agent
    attributes:
      label: Claim-Agent
      description: Leave unclaimed until the claim tool succeeds.
      value: unclaimed
    validations:
      required: true
  - type: input
    id: claim_branch
    attributes:
      label: Claim-Branch
      description: Leave none until the claim tool creates the reservation.
      value: none
    validations:
      required: true
  - type: input
    id: claimed_at
    attributes:
      label: Claimed-At
      description: Leave none until the claim tool succeeds.
      value: none
    validations:
      required: true
  - type: input
    id: integration_owner
    attributes:
      label: Integration-Owner
      description: Principal responsible for integration sequencing.
      value: maintainer
    validations:
      required: true
