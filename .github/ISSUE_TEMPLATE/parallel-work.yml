name: Parallel work item
description: Create one independently verifiable unit of work.
title: 'Work: '
labels:
  - work:proposed
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        New work starts proposed and unclaimed. The claim tool writes ownership metadata after reserving the branch. Do not include local paths or sensitive information.
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: State the outcome and exclusions; include parent links or notes here if useful.
    validations:
      required: true
  - type: textarea
    id: scope_paths
    attributes:
      label: Scope-Paths
      description: Exact repository-relative paths, directory/**, root **, or none; one entry per line.
      placeholder: |
        docs/example.md
        .github/example/**
    validations:
      required: true
  - type: input
    id: depends_on
    attributes:
      label: Depends-On
      description: Issue references or none.
      value: none
    validations:
      required: true
  - type: textarea
    id: acceptance_checks
    attributes:
      label: Acceptance checks
      description: How will the outcome be verified?
    validations:
      required: true
