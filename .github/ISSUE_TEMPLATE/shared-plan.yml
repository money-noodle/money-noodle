name: Shared parallel plan
description: Create a lightweight shared plan for a complex outcome.
title: "Plan: "
labels:
  - work:plan
  - work:proposed
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Keep one named editor on the same shared-plan section at a time. Do not include local paths or sensitive information.
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: State the independently verifiable end state.
    validations:
      required: true
  - type: textarea
    id: work_graph
    attributes:
      label: Work graph
      description: List child issues, dependencies, parallel waves, and serialized boundaries.
    validations:
      required: true
  - type: input
    id: integration_owner
    attributes:
      label: Integration-Owner
      description: Principal responsible for integration sequencing.
      value: maintainer
    validations:
      required: true
  - type: textarea
    id: risks_decisions
    attributes:
      label: Risks and decisions needed
      description: Record current risks, blockers, and decisions needed.
    validations:
      required: true
