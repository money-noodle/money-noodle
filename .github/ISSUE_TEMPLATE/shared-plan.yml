name: Shared parallel plan
description: Create a lightweight shared plan for a complex outcome.
title: 'Plan: '
labels:
  - work:plan
  - work:proposed
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Keep one named editor on the same shared-plan section at a time. Include risks, decisions, or notes where useful. Do not include local paths or sensitive information.
  - type: textarea
    id: outcome
    attributes:
      label: Outcome and acceptance
      description: State the independently verifiable end state and how to check it.
    validations:
      required: true
  - type: textarea
    id: work_graph
    attributes:
      label: Work graph
      description: List child issues, dependencies, parallel waves, and serialized boundaries.
    validations:
      required: true
