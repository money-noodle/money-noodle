packages:
  - apps/*
  - services/*
  - packages/*

injectWorkspacePackages: true

overrides:
  js-yaml@4.2.0: 4.3.2
  # 2026-10-04 (#214): vulnerable transitives with no updated parent release yet.
  'axios@<1.20.0': 1.20.0
  'brace-expansion@>=4.0.0 <5.0.11': 5.0.12
  'fast-uri@>=3.0.0 <3.1.7': 3.1.8
  'fast-uri@>=4.0.0 <4.1.4': 4.2.1
  # 2026-10-06 (GHSA-68fv-2mgg-jv7q): source-map-js <1.2.2 spends unbounded time
  # on a crafted indexed source map's section offsets, which stalls the event
  # loop. Reached only transitively, at build and generate time, through postcss
  # and magicast; both declare `^1.2.1` and so already accept the patched
  # release, making this a floor rather than a substitute for an upstream fix.
  # Remove it once every path resolves >=1.2.2 on its own.
  'source-map-js@<1.2.2': 1.2.2
  # 2026-10-06 (GHSA-r4xh-jqrq-34v2, Refs #238): smol-toml <=1.8.0 parses in
  # quadratic time, because `parseKey` rescans to the end of the document for
  # every key line. Reached only through nx, which depends on the exact version
  # 1.6.1 rather than a range, so removing the override resolves back to 1.6.1 —
  # which also carries the earlier high advisory GHSA-7w5x-hrqm-74c2 (<=1.7.0).
  # This floor replaces the undated `nx>smol-toml: 1.7.1` pin that cleared that
  # one and stopped below this fix. Remove it once every path resolves >=1.9.0 on
  # its own.
  'smol-toml@<1.9.0': 1.9.0

audit:
  ignore:
    # GHSA-vfj7-8cjw-p6xm: braces <=3.0.3 stack exhaustion on deeply nested
    # glob patterns. No patched release exists. Reached only through the
    # Next.js ESLint plugin's fast-glob at lint time; never at runtime.
    # Remove this entry when braces publishes a fix (2026-10-04, #214).
    - GHSA-vfj7-8cjw-p6xm

allowBuilds:
  '@parcel/watcher': true
  '@pb33f/openapi-changes': true
  '@swc/core': true
  esbuild: true
  nx: true
  sharp: true
  unrs-resolver: true
