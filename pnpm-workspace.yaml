packages:
  - apps/*
  - services/*
  - packages/*

injectWorkspacePackages: true

overrides:
  js-yaml@4.2.0: 4.3.2
  # 2026-10-04 (#214): vulnerable transitives with no updated parent release yet.
  'axios@<1.20.0': 1.20.0
  'brace-expansion@>=4.0.0 <5.0.11': 5.0.12
  'fast-uri@>=3.0.0 <3.1.7': 3.1.8
  'fast-uri@>=4.0.0 <4.1.4': 4.2.1
  # 2026-10-06 (GHSA-68fv-2mgg-jv7q): source-map-js <1.2.2 spends unbounded time
  # on a crafted indexed source map's section offsets, which stalls the event
  # loop. Reached only transitively, at build and generate time, through postcss
  # and magicast; both declare `^1.2.1` and so already accept the patched
  # release, making this a floor rather than a substitute for an upstream fix.
  # Remove it once every path resolves >=1.2.2 on its own.
  'source-map-js@<1.2.2': 1.2.2
  # 2026-10-06 (GHSA-r4xh-jqrq-34v2, Refs #238): smol-toml <=1.8.0 parses in
  # quadratic time, because `parseKey` rescans to the end of the document for
  # every key line. Reached only through nx, which depends on the exact version
  # 1.6.1 rather than a range, so removing the override resolves back to 1.6.1 —
  # which also carries the earlier high advisory GHSA-7w5x-hrqm-74c2 (<=1.7.0).
  # This floor replaces the undated `nx>smol-toml: 1.7.1` pin that cleared that
  # one and stopped below this fix. Remove it once every path resolves >=1.9.0 on
  # its own.
  'smol-toml@<1.9.0': 1.9.0
  # 2026-10-06 (GHSA-wq5f-xc86-pv6w, Refs #248): sharp <0.35.5 is vulnerable
  # through the librsvg library bundled in its prebuilt libvips binaries. It is
  # reached on one path, `apps/web > next > sharp`, where next@16.3.8 declares
  # the optional dependency as `^0.35.4` and so already accepts the patched
  # release; a lockfile refresh alone does not move it, because pnpm keeps an
  # existing resolution that still satisfies the range. This floor is therefore
  # an explicit, auditable pin to the patch rather than a substitute for an
  # upstream fix, and `next` itself is untouched. Remove it once the path
  # resolves >=0.35.5 on its own.
  'sharp@<0.35.5': 0.35.5
  # 2026-10-21 (GHSA-q3jh-wrc6-jgq8, GHSA-8r9p-f939-6h3c, Refs #243): follow-redirects
  # <1.16.1 leaks cross-origin credentials through array-form headers and can expose
  # sensitive headers because its `sensitiveHeaders` regular expression is not escaped.
  # Reached only through dev tooling: `nx@23.2.1` declares the exact version `1.16.0`
  # rather than a range, and also reaches it through `axios`, which the existing
  # `axios@<1.20.0` floor lifts to 1.20.0 — and axios declares `^1.16.0`, so it already
  # accepts the patch. Because nx pins the exact version, a lockfile refresh alone cannot
  # move it, which makes this an explicit, auditable floor rather than a substitute for an
  # upstream fix. Remove it once every path resolves >=1.16.1 on its own; an nx bump is
  # out of this commit's scope.
  'follow-redirects@<1.16.1': 1.16.1

audit:
  ignore:
    # GHSA-vfj7-8cjw-p6xm: braces <=3.0.3 stack exhaustion on deeply nested
    # glob patterns. No patched release exists. Reached only through the
    # Next.js ESLint plugin's fast-glob at lint time; never at runtime.
    # Remove this entry when braces publishes a fix (2026-10-04, #214).
    - GHSA-vfj7-8cjw-p6xm

allowBuilds:
  '@parcel/watcher': true
  '@pb33f/openapi-changes': true
  '@swc/core': true
  esbuild: true
  nx: true
  sharp: true
  unrs-resolver: true
