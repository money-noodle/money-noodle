<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" font-family="Helvetica, Arial, sans-serif">
  <rect width="720" height="420" fill="#1e1e1e"/>

  <!-- A -->
  <rect x="20" y="20" width="680" height="70" fill="#E3B04B"/>
  <text x="30" y="45" fill="#000" font-size="16" font-weight="bold">A — Ramen Gold</text>
  <text x="30" y="65" fill="#000" font-size="13">#E3B04B</text>
  <text x="150" y="65" fill="#000" font-size="13">Toasted noodles and golden broth; warm but restrained</text>

  <!-- B -->
  <rect x="20" y="100" width="680" height="70" fill="#F2C14E"/>
  <text x="30" y="125" fill="#000" font-size="16" font-weight="bold">B — Egg Noodle Yellow</text>
  <text x="30" y="145" fill="#000" font-size="13">#F2C14E</text>
  <text x="200" y="145" fill="#000" font-size="13">Bright, cheerful, closest in energy to the current green</text>

  <!-- C -->
  <rect x="20" y="180" width="680" height="70" fill="#D8B887"/>
  <text x="30" y="205" fill="#000" font-size="16" font-weight="bold">C — Udon Wheat</text>
  <text x="30" y="225" fill="#000" font-size="13">#D8B887</text>
  <text x="150" y="225" fill="#000" font-size="13">Soft flour-and-wheat tone; understated and premium</text>

  <!-- D -->
  <rect x="20" y="260" width="680" height="70" fill="#C98A4A"/>
  <text x="30" y="285" fill="#000" font-size="16" font-weight="bold">D — Miso Caramel</text>
  <text x="30" y="305" fill="#000" font-size="13">#C98A4A</text>
  <text x="150" y="305" fill="#000" font-size="13">Rich roasted miso color; darker and more earthy</text>

  <!-- E -->
  <rect x="20" y="340" width="680" height="60" fill="#D19A5B"/>
  <text x="30" y="365" fill="#000" font-size="16" font-weight="bold">E — Toasted Sesame</text>
  <text x="30" y="385" fill="#000" font-size="13">#D19A5B</text>
  <text x="150" y="385" fill="#000" font-size="13">Balanced golden brown; warmer than gold without looking orange</text>
</svg>
