<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
  <title id="title">Noodle Gain animation sample</title>
  <desc id="desc">A golden noodle curls into a bowl beside a sample gain of twenty-five noodles.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff9e9"/><stop offset="1" stop-color="#e1f4df"/></linearGradient>
    <linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fffef8"/><stop offset="1" stop-color="#d5eedb"/></linearGradient>
    <linearGradient id="noodle" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe176"/><stop offset="1" stop-color="#e3a12e"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="190%"><feDropShadow dx="0" dy="13" stdDeviation="12" flood-color="#17352c" flood-opacity=".17"/></filter>
    <style>
      .incoming { stroke-dasharray: 280; animation: curl 3.6s cubic-bezier(.2,.8,.2,1) infinite; }
      .steam { stroke-dasharray: 24 18; animation: steam 3.2s linear infinite; }
      .value { animation: value 3.6s ease-out infinite; transform-box: fill-box; transform-origin: left center; }
      .spark { animation: spark 3.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes curl { 0%,12% { opacity:0; stroke-dashoffset:280; transform:translateY(-55px) } 22% { opacity:1 } 55%,88% { opacity:1; stroke-dashoffset:0; transform:translateY(0) } 100% { opacity:0; stroke-dashoffset:0 } }
      @keyframes steam { to { stroke-dashoffset:-84; transform:translateY(-6px) } }
      @keyframes value { 0%,45% { transform:scale(1); fill:#17352c } 55% { transform:scale(1.08); fill:#237d35 } 68%,100% { transform:scale(1); fill:#17352c } }
      @keyframes spark { 0%,44%,75%,100% { opacity:0; transform:scale(.2) rotate(0) } 55% { opacity:1; transform:scale(1.15) rotate(25deg) } }
      @media (prefers-reduced-motion: reduce) { * { animation:none!important } .incoming { opacity:1; stroke-dashoffset:0; transform:none } }
    </style>
  </defs>
  <rect width="640" height="420" rx="36" fill="url(#bg)"/>
  <circle cx="575" cy="52" r="96" fill="#ff786b" opacity=".13"/>
  <circle cx="40" cy="405" r="120" fill="#57c3b8" opacity=".14"/>
  <text x="38" y="49" fill="#237d35" font-family="ui-rounded,system-ui,sans-serif" font-size="12" font-weight="900" letter-spacing="2">PAPER POT · SAMPLE</text>
  <g transform="translate(18 63)">
    <ellipse cx="225" cy="304" rx="151" ry="20" fill="#17352c" opacity=".14"/>
    <g class="steam" fill="none" stroke="#57c3b8" stroke-width="8" stroke-linecap="round" opacity=".58"><path d="M168 149 C136 112 184 90 158 53"/><path d="M282 149 C315 113 268 89 294 51"/></g>
    <g fill="none" stroke="url(#noodle)" stroke-width="17" stroke-linecap="round"><path d="M112 206 C147 164 187 231 219 184 C252 138 286 223 338 172"/><path d="M121 228 C160 188 194 246 233 205 C265 171 298 236 335 205"/><path class="incoming" d="M225 21 C165 79 288 97 217 158 C191 180 194 205 219 229"/></g>
    <g filter="url(#shadow)">
      <ellipse cx="225" cy="211" rx="145" ry="36" fill="#fffdf5" stroke="#17352c" stroke-width="9"/>
      <ellipse cx="225" cy="213" rx="119" ry="22" fill="#d88f35"/>
      <path d="M80 213 C92 292 143 317 225 317 C307 317 358 292 370 213Z" fill="url(#bowl)" stroke="#17352c" stroke-width="9" stroke-linejoin="round"/>
      <path d="M101 247 C165 270 285 270 349 247" fill="none" stroke="#35a94b" stroke-width="13" stroke-linecap="round"/>
      <path d="M191 285 Q225 304 259 285" fill="none" stroke="#e3b04b" stroke-width="10" stroke-linecap="round"/>
    </g>
  </g>
  <g transform="translate(414 145)">
    <text x="0" y="0" fill="#17352c" font-family="ui-rounded,system-ui,sans-serif" font-size="17" font-weight="900">VERIFIED SAMPLE</text>
    <text x="0" y="55" fill="#17352c" font-family="ui-rounded,system-ui,sans-serif" font-size="54" font-weight="950" letter-spacing="-3">Noodle</text>
    <text x="0" y="105" fill="#35a94b" font-family="ui-rounded,system-ui,sans-serif" font-size="54" font-weight="950" letter-spacing="-3">Gain</text>
    <text class="value" x="0" y="151" font-family="ui-rounded,system-ui,sans-serif" font-size="25" font-weight="900">+25 noodles</text>
    <text x="0" y="177" fill="#607168" font-family="ui-rounded,system-ui,sans-serif" font-size="13" font-weight="700">+$0.25 · settled paper sample</text>
    <g class="spark" fill="#ff786b"><path d="M177 14 l7 16 17 7 -17 7 -7 17 -7 -17 -17 -7 17 -7Z"/><circle cx="210" cy="80" r="7" fill="#9d82d8"/><circle cx="150" cy="115" r="5" fill="#57c3b8"/></g>
  </g>
</svg>
