<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Friendly onion Nomi character sheet</title>
  <desc id="desc">Six endearing poses of the Money Noodle mascot with a pearl-onion face, flowing gold noodles, green arrow leaves, and navy orbit.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#031b27"/><stop offset="1" stop-color="#0a3443"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe47f"/><stop offset=".45" stop-color="#f6bd42"/><stop offset="1" stop-color="#da921f"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#58d36a"/><stop offset="1" stop-color="#269f3e"/></linearGradient>
    <linearGradient id="onion" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fffdf0"/><stop offset=".72" stop-color="#faedc8"/><stop offset="1" stop-color="#ead7a8"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".04"/></pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="190%"><feDropShadow dx="0" dy="13" stdDeviation="11" flood-color="#00080d" flood-opacity=".5"/></filter>
    <style>
      .title{font:900 45px Impact,Haettenschweiler,'Arial Narrow Bold',sans-serif;letter-spacing:.04em;fill:#fff}.gold-text{fill:#f6bd42}.green-text{fill:#43c957}.sub{font:800 14px Arial,sans-serif;letter-spacing:.2em;fill:#82a1ab}.card{fill:#082735;stroke:#1a4b5c;stroke-width:2}.pose-title{font:900 27px Impact,Haettenschweiler,'Arial Narrow Bold',sans-serif;letter-spacing:.05em;fill:#fff}.pose-sub{font:800 12px Arial,sans-serif;letter-spacing:.14em;fill:#7f9fa9}.orbit{fill:none;stroke:#123d4d;stroke-width:10;stroke-linecap:round}.arrow{fill:url(#green);stroke:#031b27;stroke-width:9;stroke-linejoin:round}.noodle-out{fill:none;stroke:#031b27;stroke-width:29;stroke-linecap:round;stroke-linejoin:round}.noodle{fill:none;stroke:url(#gold);stroke-width:18;stroke-linecap:round;stroke-linejoin:round}.noodle-hi{fill:none;stroke:#fff2aa;stroke-width:3.5;stroke-linecap:round;opacity:.68}.onion{fill:url(#onion);stroke:#031b27;stroke-width:8;stroke-linejoin:round}.leaf{fill:url(#green);stroke:#031b27;stroke-width:7;stroke-linejoin:round}.eye{fill:#092c3b}.glint{fill:#fff}.cheek{fill:#efa18e;opacity:.72}.mouth{fill:none;stroke:#092c3b;stroke-width:4.5;stroke-linecap:round}.brow{fill:none;stroke:#356171;stroke-width:3.5;stroke-linecap:round}
    </style>
  </defs>
  <rect width="1400" height="900" rx="42" fill="url(#night)"/>
  <rect width="1400" height="900" rx="42" fill="url(#grid)"/>
  <path d="M-80 793 C245 566 440 956 775 692 C1020 498 1225 724 1510 490" fill="none" stroke="#43c957" stroke-width="100" opacity=".04"/>
  <text x="62" y="75" class="title"><tspan class="gold-text">NOMI</tspan><tspan> &amp; THE </tspan><tspan class="green-text">PEARL ONION</tspan></text>
  <text x="64" y="109" class="sub">A FRIENDLY INGREDIENT FACE · CHARACTER REFINEMENT V3</text>

