    <path class="noodle-out" d="M237 191 C274 223 245 263 208 270 C171 277 146 256 126 274"/><path class="noodle" d="M237 191 C274 223 245 263 208 270 C171 277 146 256 126 274"/>
    <g transform="rotate(-5 197 132)">
      <path class="onion" d="M184 92 C180 76 192 66 199 52 C207 66 220 76 216 92 C239 101 249 124 243 146 C236 172 213 185 189 178 C165 172 151 150 155 126 C157 108 169 97 184 92Z"/>
      <path class="leaf" d="M198 57 C183 36 185 18 201 10 C213 27 212 43 198 57Z"/><path class="leaf" d="M202 58 C209 35 227 25 241 33 C235 50 221 60 202 58Z"/>
      <path class="brow" d="M174 119 q8 -6 15 -1 M208 116 q8 -2 14 5"/><ellipse class="eye" cx="183" cy="130" rx="8" ry="10"/><circle class="glint" cx="186" cy="126" r="2.7"/><ellipse class="eye" cx="216" cy="130" rx="8" ry="10"/><circle class="glint" cx="219" cy="126" r="2.7"/><circle class="cheek" cx="170" cy="146" r="6"/><circle class="cheek" cx="228" cy="146" r="6"/><path class="mouth" d="M190 149 Q200 157 211 148"/>
    </g>
    <path class="noodle-out" d="M157 183 C134 174 121 185 126 201 C131 214 145 211 148 199"/><path class="noodle" d="M157 183 C134 174 121 185 126 201 C131 214 145 211 148 199"/>
    <text x="24" y="38" class="pose-title">CURIOUS</text><text x="25" y="59" class="pose-sub">LEAN IN · LOOK CLOSER</text>
  </g>

