<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Nomi brand-style character sheet</title>
  <desc id="desc">Six vector mascot poses rendered in the original Money Noodle navy, gold, and green graphic style.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#041d2a"/><stop offset="1" stop-color="#0a3444"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffdd68"/><stop offset=".46" stop-color="#f5bb3d"/><stop offset="1" stop-color="#d9911f"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#49c85a"/><stop offset="1" stop-color="#249b3b"/></linearGradient>
    <linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#dce8e3"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".045"/></pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="190%"><feDropShadow dx="0" dy="13" stdDeviation="11" flood-color="#000b10" flood-opacity=".48"/></filter>
    <symbol id="orbit" viewBox="0 0 280 250">
      <path d="M47 171 A106 106 0 1 1 224 177" fill="none" stroke="#174456" stroke-width="10" stroke-linecap="round"/>
      <path d="M215 155 L248 174 L217 195Z" fill="url(#green)" stroke="#041d2a" stroke-width="8" stroke-linejoin="round"/>
    </symbol>
    <symbol id="bowl-base" viewBox="0 0 250 150">
      <ellipse cx="125" cy="37" rx="105" ry="27" fill="#061e2b" opacity=".35"/>
      <path d="M20 36 C28 113 69 140 125 140 C181 140 222 113 230 36Z" fill="url(#bowl)" stroke="#041d2a" stroke-width="10" stroke-linejoin="round"/>
      <path d="M31 69 C84 89 166 89 219 69" fill="none" stroke="url(#green)" stroke-width="12" stroke-linecap="round"/>
      <ellipse cx="125" cy="35" rx="105" ry="27" fill="#f9fbf8" stroke="#041d2a" stroke-width="10"/>
      <ellipse cx="125" cy="37" rx="83" ry="14" fill="#ba7422"/>
      <path d="M95 113 Q125 130 155 113" fill="none" stroke="url(#gold)" stroke-width="9" stroke-linecap="round"/>
    </symbol>
    <style>
      .title { font: 900 46px Impact,Haettenschweiler,'Arial Narrow Bold',sans-serif; letter-spacing: .035em; fill: #fff; }
      .word-gold { fill:#f5bb3d; } .word-green { fill:#39b94e; }
      .sub { font: 800 14px Arial,sans-serif; letter-spacing: .2em; fill: #83a4ad; }
      .pose-title { font: 900 27px Impact,Haettenschweiler,'Arial Narrow Bold',sans-serif; letter-spacing: .045em; fill:#fff; }
      .pose-sub { font: 800 12px Arial,sans-serif; letter-spacing: .14em; fill:#7fa0aa; }
      .card { fill:#082735; stroke:#1b4b5c; stroke-width:2; }
      .outline { fill:none; stroke:#041d2a; stroke-width:42; stroke-linecap:round; stroke-linejoin:round; }
      .strand { fill:none; stroke:url(#gold); stroke-width:28; stroke-linecap:round; stroke-linejoin:round; }
      .highlight { fill:none; stroke:#fff3a1; stroke-width:5; stroke-linecap:round; opacity:.66; }
      .eye { fill:#041d2a; } .eye-shine { fill:white; }
      .stick { stroke:#a76531; stroke-width:11; stroke-linecap:round; }
    </style>
  </defs>
  <rect width="1400" height="900" rx="42" fill="url(#night)"/>
  <rect width="1400" height="900" rx="42" fill="url(#grid)"/>
  <path d="M-80 790 C250 560 435 960 770 690 C1010 496 1220 725 1510 490" fill="none" stroke="#39b94e" stroke-width="100" opacity=".045"/>
  <text x="62" y="75" class="title"><tspan class="word-gold">NOMI</tspan><tspan fill="#fff"> THE </tspan><tspan class="word-green">NOODLER</tspan></text>
  <text x="64" y="109" class="sub">MONEY NOODLE BRAND PASS · VECTOR CHARACTER SYSTEM V1</text>

  <!-- card helper layout: 410 x 310 -->
  <g transform="translate(55 145)">
    <rect class="card" width="410" height="310" rx="22" filter="url(#shadow)"/>
    <use href="#orbit" x="90" y="48" width="265" height="238" opacity=".72"/>
    <use href="#bowl-base" x="99" y="143" width="225" height="135"/>
    <path class="outline" d="M169 211 C131 169 156 98 211 100 C269 102 294 162 260 211"/>
    <path class="strand" d="M169 211 C131 169 156 98 211 100 C269 102 294 162 260 211"/>
    <path class="highlight" d="M167 179 C157 133 181 113 212 113"/>
    <circle class="eye" cx="193" cy="139" r="8"/><circle class="eye-shine" cx="196" cy="136" r="2.5"/>
    <circle class="eye" cx="231" cy="140" r="8"/><circle class="eye-shine" cx="234" cy="137" r="2.5"/>
    <path d="M198 162 Q212 173 227 161" fill="none" stroke="#041d2a" stroke-width="6" stroke-linecap="round"/>
    <text x="24" y="38" class="pose-title">CURIOUS</text><text x="25" y="59" class="pose-sub">NEW SIGNAL · OPEN MIND</text>
  </g>

  <g transform="translate(495 145)">
    <rect class="card" width="410" height="310" rx="22" filter="url(#shadow)"/>
    <use href="#orbit" x="91" y="52" width="265" height="238" opacity=".72"/>
    <use href="#bowl-base" x="100" y="152" width="225" height="135"/>
    <path class="outline" d="M169 219 C150 178 150 145 204 130 C267 112 288 61 248 38 C208 15 161 44 166 85"/>
    <path class="strand" d="M169 219 C150 178 150 145 204 130 C267 112 288 61 248 38 C208 15 161 44 166 85"/>
    <path class="highlight" d="M177 177 C171 152 188 146 211 139"/>
    <circle cx="173" cy="110" r="14" fill="url(#gold)" stroke="#041d2a" stroke-width="8"/>
    <circle class="eye" cx="202" cy="155" r="7"/><circle class="eye" cx="232" cy="147" r="7"/>
    <text x="24" y="38" class="pose-title">NOODLING</text><text x="25" y="59" class="pose-sub">QUESTION IN MOTION</text>
  </g>

  <g transform="translate(935 145)">
    <rect class="card" width="410" height="310" rx="22" filter="url(#shadow)"/>
    <use href="#orbit" x="91" y="51" width="265" height="238" opacity=".72"/>
    <use href="#bowl-base" x="100" y="152" width="225" height="135"/>
    <path class="outline" d="M166 220 C137 175 153 105 211 104 C270 105 286 175 256 220"/>
    <path class="strand" d="M166 220 C137 175 153 105 211 104 C270 105 286 175 256 220"/>
    <path class="highlight" d="M167 177 C156 138 177 117 207 116"/>
    <circle class="eye" cx="194" cy="139" r="7"/><circle class="eye" cx="228" cy="139" r="7"/>
    <line x1="211" y1="176" x2="211" y2="89" stroke="#041d2a" stroke-width="7"/>
    <line x1="157" y1="105" x2="266" y2="89" stroke="#041d2a" stroke-width="7" stroke-linecap="round"/>
    <path d="M137 108 L173 103 L163 139 Q148 146 137 108Z" fill="url(#green)" stroke="#041d2a" stroke-width="6"/>
    <path d="M249 91 L285 86 L278 123 Q262 130 249 91Z" fill="url(#gold)" stroke="#041d2a" stroke-width="6"/>
    <text x="24" y="38" class="pose-title">COMPARING</text><text x="25" y="59" class="pose-sub">WEIGH BOTH SIDES</text>
  </g>

  <g transform="translate(55 495)">
    <rect class="card" width="410" height="310" rx="22" filter="url(#shadow)"/>
    <use href="#orbit" x="90" y="52" width="265" height="238" opacity=".72"/>
    <use href="#bowl-base" x="99" y="153" width="225" height="135"/>
    <path class="outline" d="M169 220 C142 182 145 134 182 110 C151 67 180 32 212 32 C244 32 274 67 240 110 C280 134 281 182 254 220"/>
    <path class="strand" d="M169 220 C142 182 145 134 182 110 C151 67 180 32 212 32 C244 32 274 67 240 110 C280 134 281 182 254 220"/>
    <path class="highlight" d="M181 176 C164 143 179 123 198 115"/>
    <path d="M191 111 H233 M197 125 H227" stroke="#041d2a" stroke-width="7" stroke-linecap="round"/>
    <circle class="eye" cx="195" cy="151" r="7"/><circle class="eye" cx="228" cy="151" r="7"/>
    <path d="M196 174 Q212 188 229 173" fill="none" stroke="#041d2a" stroke-width="6" stroke-linecap="round"/>
    <path d="M149 53 l-18 -16 M277 53 l18 -16 M212 11 v-22" stroke="#39b94e" stroke-width="8" stroke-linecap="round"/>
    <text x="24" y="38" class="pose-title">EUREKA</text><text x="25" y="59" class="pose-sub">THE LESSON LANDED</text>
  </g>

  <g transform="translate(495 495)">
    <rect class="card" width="410" height="310" rx="22" filter="url(#shadow)"/>
    <use href="#orbit" x="91" y="52" width="265" height="238" opacity=".72"/>
    <use href="#bowl-base" x="100" y="153" width="225" height="135"/>
    <path class="outline" d="M166 220 C140 178 151 111 211 106 C271 111 282 178 256 220"/>
    <path class="strand" d="M166 220 C140 178 151 111 211 106 C271 111 282 178 256 220"/>
    <path class="highlight" d="M167 177 C157 140 178 118 207 117"/>
    <circle class="eye" cx="194" cy="143" r="7"/><circle class="eye" cx="228" cy="143" r="7"/>
    <path d="M195 175 Q211 164 228 175" fill="none" stroke="#041d2a" stroke-width="6" stroke-linecap="round"/>
    <line class="stick" x1="126" y1="90" x2="296" y2="225"/><line class="stick" x1="296" y1="90" x2="126" y2="225"/>
    <text x="24" y="38" class="pose-title">CAUTIOUS</text><text x="25" y="59" class="pose-sub">STALE · BLOCKED · WAIT</text>
  </g>

  <g transform="translate(935 495)">
    <rect class="card" width="410" height="310" rx="22" filter="url(#shadow)"/>
    <use href="#orbit" x="91" y="52" width="265" height="238" opacity=".72"/>
    <use href="#bowl-base" x="100" y="153" width="225" height="135"/>
    <path class="outline" d="M166 220 C139 181 154 120 211 117 C268 120 283 181 256 220"/>
    <path class="strand" d="M166 220 C139 181 154 120 211 117 C268 120 283 181 256 220"/>
    <path class="highlight" d="M168 177 C159 143 181 130 207 129"/>
    <path d="M183 151 q10 9 20 0 M220 151 q10 9 20 0" fill="none" stroke="#041d2a" stroke-width="7" stroke-linecap="round"/>
    <text x="280" y="106" fill="#39b94e" font-family="Arial,sans-serif" font-size="31" font-weight="900">Z</text>
    <text x="310" y="78" fill="#39b94e" font-family="Arial,sans-serif" font-size="20" font-weight="900">Z</text>
    <text x="24" y="38" class="pose-title">RESTING</text><text x="25" y="59" class="pose-sub">NO ACTION NEEDED</text>
  </g>
</svg>
