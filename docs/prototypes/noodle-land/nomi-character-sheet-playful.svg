<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Nomi the Noodler character sheet</title>
  <desc id="desc">Six vector mascot poses: curious, noodling, comparing, eureka, cautious, and resting.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff9e9"/>
      <stop offset="1" stop-color="#edf8df"/>
    </linearGradient>
    <linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fffdf5"/>
      <stop offset="1" stop-color="#dff3e4"/>
    </linearGradient>
    <linearGradient id="noodle" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffd867"/>
      <stop offset="1" stop-color="#e9a82f"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#163128" flood-opacity=".16"/>
    </filter>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2" fill="#2f9843" opacity=".1"/>
    </pattern>
    <symbol id="bowl-base" viewBox="0 0 240 150">
      <ellipse cx="120" cy="32" rx="101" ry="26" fill="#17352c" opacity=".12"/>
      <path d="M20 30 C28 112 65 139 120 139 C175 139 212 112 220 30Z" fill="url(#bowl)" stroke="#17352c" stroke-width="8" stroke-linejoin="round"/>
      <path d="M30 61 C82 79 158 79 210 61" fill="none" stroke="#35a94b" stroke-width="9" stroke-linecap="round"/>
      <ellipse cx="120" cy="30" rx="101" ry="26" fill="#fffdf5" stroke="#17352c" stroke-width="8"/>
      <ellipse cx="120" cy="32" rx="82" ry="15" fill="#d88f35" opacity=".84"/>
      <path d="M91 112 Q120 128 149 112" fill="none" stroke="#e3b04b" stroke-width="8" stroke-linecap="round"/>
    </symbol>
    <style>
      .label { font: 800 26px ui-rounded, system-ui, sans-serif; fill: #17352c; }
      .caption { font: 600 15px ui-rounded, system-ui, sans-serif; fill: #5c6d64; letter-spacing: .04em; }
      .card { fill: #fffdf8; stroke: #d9e5d7; stroke-width: 2; }
      .outline { fill: none; stroke: #17352c; stroke-width: 34; stroke-linecap: round; stroke-linejoin: round; }
      .strand { fill: none; stroke: url(#noodle); stroke-width: 23; stroke-linecap: round; stroke-linejoin: round; }
      .eye { fill: #17352c; }
      .shine { fill: white; opacity: .9; }
      .stick { stroke: #8f4d2d; stroke-width: 9; stroke-linecap: round; }
      .steam { fill: none; stroke: #54b9ac; stroke-width: 7; stroke-linecap: round; opacity: .65; }
    </style>
  </defs>

  <rect width="1400" height="900" rx="42" fill="url(#paper)"/>
  <rect width="1400" height="900" rx="42" fill="url(#dots)"/>
  <circle cx="1280" cy="80" r="120" fill="#ff786b" opacity=".13"/>
  <circle cx="95" cy="850" r="180" fill="#62c7c0" opacity=".13"/>
  <text x="70" y="78" class="label" style="font-size:42px">Nomi the Noodler</text>
  <text x="70" y="112" class="caption">EXPLORATORY VECTOR CHARACTER SHEET · V0</text>

  <!-- Curious -->
  <g transform="translate(60 155)">
    <rect class="card" width="400" height="305" rx="28" filter="url(#shadow)"/>
    <g transform="translate(80 94)"><use href="#bowl-base" width="240" height="150"/></g>
    <path class="outline" d="M154 189 C117 148 139 90 198 95 C258 100 276 153 241 190"/>
    <path class="strand" d="M154 189 C117 148 139 90 198 95 C258 100 276 153 241 190"/>
    <circle class="eye" cx="178" cy="127" r="8"/><circle class="shine" cx="181" cy="124" r="2.5"/>
    <circle class="eye" cx="217" cy="130" r="8"/><circle class="shine" cx="220" cy="127" r="2.5"/>
    <path d="M187 151 Q199 160 212 150" fill="none" stroke="#17352c" stroke-width="5" stroke-linecap="round"/>
    <text x="26" y="42" class="label">Curious</text><text x="26" y="67" class="caption">A NEW IDEA</text>
  </g>

  <!-- Noodling -->
  <g transform="translate(500 155)">
    <rect class="card" width="400" height="305" rx="28" filter="url(#shadow)"/>
    <g transform="translate(80 120)"><use href="#bowl-base" width="240" height="150"/></g>
    <path class="outline" d="M164 218 C145 173 148 134 199 124 C258 112 282 63 245 37 C208 11 152 34 155 78"/>
    <path class="strand" d="M164 218 C145 173 148 134 199 124 C258 112 282 63 245 37 C208 11 152 34 155 78"/>
    <circle cx="167" cy="104" r="13" fill="#e3b04b" stroke="#17352c" stroke-width="7"/>
    <circle class="eye" cx="190" cy="147" r="7"/><circle class="eye" cx="220" cy="141" r="7"/>
    <text x="26" y="42" class="label">Noodling</text><text x="26" y="67" class="caption">THINKING IT THROUGH</text>
  </g>

  <!-- Comparing -->
  <g transform="translate(940 155)">
    <rect class="card" width="400" height="305" rx="28" filter="url(#shadow)"/>
    <g transform="translate(80 120)"><use href="#bowl-base" width="240" height="150"/></g>
    <path class="outline" d="M153 219 C124 170 142 101 201 101 C261 101 278 169 244 220"/>
    <path class="strand" d="M153 219 C124 170 142 101 201 101 C261 101 278 169 244 220"/>
    <circle class="eye" cx="183" cy="135" r="7"/><circle class="eye" cx="218" cy="135" r="7"/>
    <line x1="201" y1="167" x2="201" y2="91" stroke="#17352c" stroke-width="6"/>
    <line x1="150" y1="106" x2="252" y2="91" stroke="#17352c" stroke-width="6" stroke-linecap="round"/>
    <path d="M132 111 L166 106 L157 137 Q143 144 132 111Z" fill="#62c7c0" stroke="#17352c" stroke-width="5"/>
    <path d="M236 94 L270 89 L263 121 Q248 128 236 94Z" fill="#ff8c78" stroke="#17352c" stroke-width="5"/>
    <text x="26" y="42" class="label">Comparing</text><text x="26" y="67" class="caption">FOR AND AGAINST</text>
  </g>

  <!-- Eureka -->
  <g transform="translate(60 505)">
    <rect class="card" width="400" height="305" rx="28" filter="url(#shadow)"/>
    <g transform="translate(80 120)"><use href="#bowl-base" width="240" height="150"/></g>
    <path class="outline" d="M158 218 C132 181 137 127 177 106 C143 61 177 24 204 24 C232 24 266 61 229 106 C270 130 273 181 243 218"/>
    <path class="strand" d="M158 218 C132 181 137 127 177 106 C143 61 177 24 204 24 C232 24 266 61 229 106 C270 130 273 181 243 218"/>
    <path d="M184 102 H224 M190 116 H218" stroke="#17352c" stroke-width="6" stroke-linecap="round"/>
    <circle class="eye" cx="182" cy="146" r="7"/><circle class="eye" cx="218" cy="146" r="7"/>
    <path d="M185 169 Q200 182 217 168" fill="none" stroke="#17352c" stroke-width="5" stroke-linecap="round"/>
    <path d="M132 45 l-19 -14 M275 45 l19 -14 M204 2 v-22" stroke="#e3b04b" stroke-width="7" stroke-linecap="round"/>
    <text x="26" y="42" class="label">Eureka</text><text x="26" y="67" class="caption">A LESSON LANDED</text>
  </g>

  <!-- Cautious -->
  <g transform="translate(500 505)">
    <rect class="card" width="400" height="305" rx="28" filter="url(#shadow)"/>
    <g transform="translate(80 120)"><use href="#bowl-base" width="240" height="150"/></g>
    <path class="outline" d="M156 219 C129 177 139 111 200 104 C260 112 271 177 244 219"/>
    <path class="strand" d="M156 219 C129 177 139 111 200 104 C260 112 271 177 244 219"/>
    <circle class="eye" cx="182" cy="139" r="7"/><circle class="eye" cx="218" cy="139" r="7"/>
    <path d="M184 172 Q201 161 217 172" fill="none" stroke="#17352c" stroke-width="5" stroke-linecap="round"/>
    <line class="stick" x1="112" y1="87" x2="282" y2="220"/><line class="stick" x1="282" y1="87" x2="112" y2="220"/>
    <text x="26" y="42" class="label">Cautious</text><text x="26" y="67" class="caption">STALE OR BLOCKED</text>
  </g>

  <!-- Resting -->
  <g transform="translate(940 505)">
    <rect class="card" width="400" height="305" rx="28" filter="url(#shadow)"/>
    <g transform="translate(80 120)"><use href="#bowl-base" width="240" height="150"/></g>
    <path class="outline" d="M156 219 C128 180 145 119 201 116 C257 120 273 179 243 219"/>
    <path class="strand" d="M156 219 C128 180 145 119 201 116 C257 120 273 179 243 219"/>
    <path d="M173 147 q10 9 20 0 M208 147 q10 9 20 0" fill="none" stroke="#17352c" stroke-width="6" stroke-linecap="round"/>
    <path class="steam" d="M275 103 C304 84 268 68 294 47"/>
    <text x="301" y="50" class="label" fill="#54b9ac">z</text><text x="323" y="28" class="label" fill="#54b9ac" style="font-size:20px">z</text>
    <text x="26" y="42" class="label">Resting</text><text x="26" y="67" class="caption">NO ACTION NEEDED</text>
  </g>
</svg>
